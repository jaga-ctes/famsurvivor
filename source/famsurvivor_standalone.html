rom Settings.","On iPhone and iPad, if you don't add the app to the home screen, Safari may delete its data after about 7 days without use. Install it or make a backup.","How to install it","There's no space left on the phone to save. Free up space and export a backup.","The last change couldn't be saved. Export a backup just in case.","Your household's self-sufficiency today","day","days","You meet your {target}-day goal","Your goal is {target} days","{name}: {days} of {target} days","doesn't set self-sufficiency","This is your weakest link","You still need:","How it's calculated","See formulas and sources","For today","Due for a check today","The 8 pillars","Not started","In progress","Covered","Self-sufficiency is the lowest of your critical resources: food for two weeks is no use if the water only lasts two days. Expired items don't count.","Water: you have {have} L and your household uses {perDay} L a day.","Includes the extra for extreme heat.","Food: you have {have} kcal and your household needs {perDay} kcal a day.","Medication: units you have divided by doses per day; the one that runs out first counts.","Power: you have {have} usable Wh and use {perDay} Wh a day ({phones} phone(s) in power-saving mode plus charged devices).","Pets: you have {have} kg of food and they eat {perDay} g a day.","{n} food item has no calories entered: it isn't counted. Edit it to include it.","{n} food items have no calories entered: they aren't counted. Edit them to include them.","{n} expired item isn't counted.","{n} expired items aren't counted.","One ration equals {ration} kcal. Water level: {comfort}.","Replace {n} expired item","Replace {n} expired items","{n} item expires in less than 30 days: use it and restock","{n} items expire in less than 30 days: use them and restock","Check due: {label}","Check due: {label} (and {more} more)","Fill what's missing in: {name}","Set Meeting point A","Run your first drill","Your household in 2 minutes","This is enough to calculate. Later you can fill in each member if you want. We don't ask for names or IDs.","Adults aged 18 to 64","People aged 65 or over","Teenagers aged 14 to 17","Children aged 9 to 13","Children aged 4 to 8","Children aged 1 to 3","Babies (under 1 year)","Up to {max} members in total, counting pets.","Dogs","Cats","Calculate my plan","Add at least one person or pet.","Done. You now have your calculation and a shopping list.","Your household","Household details","Neighborhood or city","Optional and approximate. The app doesn't use GPS or addresses.","Not set","Country","Reference region","Used to suggest the most common hazards. You adjust them afterwards.","For now, regional hazard profiles are for Argentina only. In other countries you start from the generic profile: review and adjust each hazard for your area.","Home type","Floor (0 = ground floor)","floor {n}","Our water depends on an electric pump","We depend on the elevator","Water","Tank capacity (liters)","You also have about {l} L in the tank. It doesn't count as drinking water: make it safe before drinking.","Gas","We have a generator","We have solar power","We have a vehicle","Also","Size of the water jug you buy (liters)","Used to tell you how many jugs you're missing.","Phones to keep charged","Leave it empty to count one for each person aged 14 or over.","Days you want to cover","3 days (the recommended minimum)","7 days","14 days","30 days","Water level","Minimum","Recommended","Minimum: drinking and cooking. Recommended: adds {l} L per person per day for basic hygiene.","Members","{people} and {pets}. Use nicknames or roles: never full names or ID numbers.","You haven't added any members yet.","Add member","New member","Edit member","Everything is optional except the nickname. Health details stay only on this phone, can be hidden and aren't printed unless you ask.","This is","A person","A pet","Nickname","For example: Mom, Grandpa, Adult 2, Rocco.","Role in the plan","For example: contact person, supplies","Age","Species","Weight (kg)","Optional. For pets it adjusts water and food.","no weight entered","Things to keep in mind","Only mark what changes your preparation. The app doesn't give medical advice.","Power use of the electrical device (watts)","It's on the device's label. Talk to your power company and your doctor about a backup.","Hours of use per day","Devices and aids","Per day: {l} L of water · {kcal} kcal","Per day: {l} L of water · {g} g of dry food","Edit {name}","Delete {name}","Delete {name}?","Their roles in the plan become “unassigned” so you can reassign them.","Add medication","{name}'s medication","{name}'s medication","Only to know how many days it lasts. The app doesn't give doses: ask your doctor or pharmacy how to keep a supply.","Name","Units you have","Doses per day","As your doctor told you.","Needs refrigeration","If the power goes out, you'll need a plan to keep it cold. Ask your pharmacy.","needs refrigeration","lasts {days} days","Edit {name}","Delete {name}","Hazards in your area","Say how likely each one is where you live. The most relevant ones stay on top.","Apply suggestion","Apply the “{name}” suggestion?","It replaces the levels you set. It's a starting point: adjust them to your neighborhood.","Suggestion applied. Check the levels.","{name} level","What changes:","Before","During","After","Source:","Supplies sections","Inventory","Shopping","Checks","All","Filter by pillar","Your supplies are empty. Add what you already have at home.","You haven't added anything to this pillar yet.","Add to supplies","Add to supplies","Edit item","Pillar","Choose from the list","Type it in","Fills in the details for you. You can correct them afterwards.","What it is","Quantity","Unit","Liters per unit","A 6 L jug: type 6. Without this it isn't counted as water.","It's pet food","Enter it in kg to calculate how many days it lasts.","Calories (kcal) per unit","It's on the package. If you enter “rations”, one ration is 700 kcal.","Capacity per unit (Wh)","A 10,000 mAh power bank is about 37 Wh.","Expiry date","Optional. With a date, the app warns you before it expires.","Where it's stored","For example: top cupboard","Checked today","Checked today","Edit {name}","Delete {name}","Delete “{name}”?","Expired {n} day ago","Expired {n} days ago","Expires in {n} day","Expires in {n} days","Expires on {date}","Up to date · expires on {date}","No date","Cash","Optional. If you enter it, it stays only on this phone and you can hide it on screen.","Estimated daily spending in an emergency","Cash put aside","Leave it empty if you'd rather not write it down.","Goal: {amount} for {days} days.","No goal entered.","Put aside: {amount}.","Amount not entered.","Small bills are better: there may be no change.","Shopping list for {days} days","It's based on what you're missing to reach your goal. Buy a little at a time, with your usual shopping.","You have everything for your goal.","{liters} L of water (≈ {count} jugs of {size} L)","Ready-to-eat food: {rations} rations (≈ {kcal} kcal)","{kg} kg of pet food","{name}: {units} units missing","Power: {wh} Wh (≈ {count} 10,000 mAh power banks)","For the baby: about {diapers} diapers, their food or formula and safe water to prepare it","For medication, talk to your doctor or pharmacy: they can tell you how to keep a supply.","Someone in your household has celiac disease: choose gluten-free products.","Someone in your household has food allergies: check the ingredients.","Regular checks","Stored items expire and batteries run down. These checks keep your preparation up to date.","No checks scheduled.","Use the suggested checks","Add check","New check","Edit check","What to check","How often","Every month","Every 3 months","Every 6 months","Every year","Next time","Next: {date} · every {every} days","Due since {date}","Done","Noted. We'll show it again when it's due.","Noted. If you want to time it, do it from Plan → Practice.","In 7 days","Postponed 7 days.","Edit {name}","Delete {name}","Delete “{name}”?","Add to calendar (.ics)","File downloaded. Open it to add it to your calendar.","FamSurvivor: check due","Run a family drill","The app can't send you notifications while it's closed. To have your phone remind you, add the checks to your calendar with the .ics file: they become recurring events with an alarm.","So every member knows what to do, where and when, even if you can't communicate.","Plan sections","Meeting","Roles","Practice","Meeting points","Choose places everyone knows and that won't change.","Point A (near home)","For example: the square, by the flagpole","To get out of the house quickly: a fire, a gas leak.","Point B (outside the neighborhood)","For example: a relative's house","In case you can't go back to the neighborhood.","Point C (optional)","An alternative, for example in another city.","How long to wait at Point A","{n} h","If we're not together and there's no communication: go to Point A, wait {hours} h and then go to Point B.","Communication window","Agree on fixed times to turn on phones and the radio. That saves battery and you'll overlap.","Every","{n} {unit}","minutes","h","At minute","Next window: {time} (in {min} min)","Communication window: every {every} min, from minute :{minute}.","What to do in the window","For example: turn on the AM radio and check texts","Texts first: when the network is overloaded, a short message often gets through even if a call doesn't. Say who you are, where you are, how you are and where you're going.","Out-of-area contact","Someone in another city that everyone checks in with. Sometimes it's easier to reach someone far away than nearby.","Nickname or reference","Phone","For example: Aunt, Next-door neighbor.","Phones","Emergency numbers:","There are no phone numbers loaded for your country. Add the ones for your area.","check with your local government","Add contact","Edit contact","Edit {name}","Delete {name}","Contacts","Write these numbers down on paper: if your phone runs out of battery, the contact list is useless. You can print them from Settings.","Situation","Any emergency","Who does what","One task per person, with a place and a moment. Something that can be done without asking.","There are no tasks for this situation yet.","Unassigned","Add task","New task","Edit task","Write it as a short instruction that makes sense under stress.","Who","What they do","For example: shut off the gas and take the documents","Where","For example: valve next to the meter","When","For example: as soon as we decide to leave","Use a template","Template added. Adapt it to your home.","Edit task","Delete task","Delete this task?","Does everyone know?","A plan only works if everyone has it and has practiced it. Tick the boxes as you go.","Member","Card","Points","Role","Practice","has their printed card","knows points A and B","knows their role","did the drill","Drill","Practice with the clock running, as if it were real. Each step you tick saves its time.","goal {min} min","Start drill","Drills done","goal {time}","Within the goal","Over the goal","best time","Time for each step","What went wrong:","Improving it: {name}","Delete drill","Delete this drill?","Drill finished: {time}","{n} step of {total}","{n} steps of {total}","This is your first time","New best time: {diff} faster","{diff} slower than your best time","What went wrong or was hard?","For example: we couldn't find the flashlight; nobody knew where to shut off the gas.","Who will work on improving it?","Do it again","Save drill","Drill saved. The next one is scheduled.","Quick guides","To have at hand offline. They don't replace a first aid course or official instructions.","Emergency","Emergency in progress","What's happening?","Choose the situation. You'll see the steps in order and your details at hand. Works offline.","Drill steps","Drill","Time elapsed","{done} of {total} steps done","Your details","No meeting points entered.","No tasks entered for this situation.","You have {have} L. At {perDay} L a day it lasts {days} days.","Medication","Take your medication with you and keep up your usual treatment.","needs refrigeration","Finish","Finish drill","Is the emergency over?","You did {done} of {total} steps. A record is saved and the checklist closes.","Back to the app (still in progress)","Cancel drill","Cancel the drill without saving it?","Record saved. When you can, restock what you used.","Print","Paper never runs out of battery. It prints in black and white.","Wallet card","Fridge sheet","Go-bag checklist","What to include","Sensitive details are only printed if you tick them. Think about who might see that piece of paper.","sensitive","My contacts","Who does what","Medication","Health conditions","Household self-sufficiency","Cash put aside","Cut along the dotted line and fold in half. One card per person.","Family plan","Emergency go-bag","One bag per person, near the exit. Check it every six months.","Adapt it to your family and to what your civil protection agency recommends.","My task","Printed on {date}. It does not replace instructions from the authorities.","Household of {people} and {pets} · {days}-day goal","Current self-sufficiency: {days} days","Backup","Your data lives only on this phone. If it breaks, gets lost or you clear the browser data, it's gone. Save a backup and share it with the other phones in your household.","Export encrypted (.fsbackup)","Export unencrypted (.json)","Import a backup","Copy the plan as text","Export","Backup downloaded.","Export without encryption?","Anyone who opens the file will be able to read it, including medication and cash if you entered them. To send it by messaging app, the encrypted backup is better.","The file is encrypted with 256-bit AES-GCM; the key comes from your passphrase with PBKDF2 ({iter} iterations).","Encrypted backup","Open","Review before importing","Backup","Now","People","Pets","Items","Tasks","Contacts","Drills","Replace deletes what you have now and keeps the backup. Merge keeps what you have and adds what's missing. This phone's settings don't change.","Replace everything","Merge","Backup imported.","Backup merged with your data.","This is a backup from the previous version. It was converted to the new format: supply quantities were free text, so check them. If it was the original demo, its data is example data.","This backup is marked as example data.","The file is empty.","The file is larger than 1 MB: it doesn't look like a FamSurvivor backup.","The file is damaged or isn't a backup: it couldn't be read.","The file doesn't have the format of a FamSurvivor backup.","We don't recognize this file as a FamSurvivor backup.","The backup is missing parts (household, members or supplies). Nothing was imported.","This backup is from a newer version of the app. Update FamSurvivor and try again.","The file couldn't be read.","Privacy","Encryption on","Not encrypted","What's saved on this phone is encrypted. The key only exists while the app is unlocked.","Data is saved on this phone without encryption: anyone who unlocks it and opens the browser could read it. You can protect it with a passphrase.","Turn on encryption","Change the passphrase","Protect with a passphrase","It uses 256-bit AES-GCM and PBKDF2 with {iter} iterations. You'll type the passphrase every time you open the app.","Passphrase","Use four words or more. A short PIN can be guessed by trying combinations if someone copies your data.","Repeat the passphrase","I understand that if I forget the passphrase there's no way to recover the data","Confirm that you understand.","The two passphrases don't match.","It's too short or only numbers. Use at least 8 characters; four words is better.","The passphrase isn't correct.","Encryption turned on.","Remove encryption","Remove encryption?","Data will be saved on this phone without encryption again.","Encryption removed.","Lock now","Lock when idle after","{n} min","Lock when leaving the app for more than 30 seconds","During an emergency in progress the app doesn't lock by itself, so you don't lose the checklist.","Hide sensitive details on screen","Covers health, medication and cash until you tap “Show details”. It isn't encryption: it just keeps prying eyes away.","This browser, or this way of opening the app, doesn't offer encryption (HTTPS is required). Encrypted backups aren't available here.","Delete all data","Delete everything?","Everything entered on this phone is deleted. This can't be undone. If you want to keep it, export a backup first.","Data deleted.","Your data is encrypted. Type your passphrase to open it.","Unlock","Checking…","Too many attempts. Wait {s} seconds.","Without the passphrase there's no way to recover the data. If you lost it, clear the site data in your browser and import a backup.","Appearance","Screen mode","Automatic","Day","Night","Battery saver","Automatic follows your phone: day when it's light, night in the dark. Day is easier to read in sunlight. Battery saver uses pure black and turns off shadows and animations: on OLED screens it uses much less power.","Designed by","Language","Changes the app's text. What you wrote yourself stays as it is.","unit","units","L","L","kg","kg","ration","rations","can","cans","pack","packs","box","boxes","pair","pairs","Large text","More contrast","Installation and version","Install FamSurvivor","Installed on this device","On Android: open the browser menu and choose “Install app” or “Add to Home screen”.","On iPhone or iPad: open it in Safari, tap Share and choose “Add to Home Screen”.","Version","content {v}","Storage","On this phone (IndexedDB)","On this phone (simple storage)","Only in memory: lost when closed","protected from automatic cleanup","the browser could clear it if space runs low","Offline","Ready to use offline","Not yet: open it once more while online","Not available in the single-file version","Check for updates","Update","A new version is available. Your data isn't touched.","You already have the latest version.","Couldn't check. Try while online.","The app doesn't use push notifications, analytics or third-party services.","Sources and how it's calculated","Content reviewed on {date}. Each figure shows where it comes from and whether it could be checked against the official source.","Formulas","Sources","Open source","Links open in the browser and need a connection. The app itself doesn't connect to any site.","Water per person per day: {adult} L for drinking from age 9, + 1 L for cooking, + {heat} L if you set extreme heat at medium or high, + {hyg} L for hygiene at the Recommended level. Pregnancy adds 0.5 L and breastfeeding 1 L.","Children: babies {a} L (includes water to prepare their food), ages 1 to 3 {b} L, ages 4 to 8 {c} L, plus 1 L for cooking from age 1. Heat adds 0.5 L.","Pets: dogs {dog} ml per kg per day, cats {cat} ml per kg, with a minimum of {min} L. In hot weather, 25% more.","Food: {kcal} kcal per person per day from age 9; 1,400 from 4 to 8; 1,000 from 1 to 3; 700 for babies. Pregnancy +300 and breastfeeding +500. One ration = {ration} kcal.","Pet food: resting energy (70 × weight^0.75) × 1.6 for dogs or 1.2 for cats, at {k} kcal per gram of dry food. It's a guide: check the table on the package.","Medication: days covered = units you have ÷ doses per day. The app never suggests doses.","Power: {phone} Wh per phone per day in power-saving mode, plus watts × hours of each charged device. For power banks, {eff}% is counted because of losses.","Cash: the daily spending you estimate × goal days.","Self-sufficiency: the lowest value among water, food, medication (if entered), pet food (if you have pets) and power (only if someone depends on electrical equipment). Totals are rounded up; days, down.","Expiry: expired, less than 30 days, less than 90 days or up to date. Expired items don't count as stock.","About","FamilySurvivor (FamSurvivor) helps any household prepare for water or power outages, storms, floods and other emergencies, and have a plan when there's no communication.","Local-first: no server, no accounts, no tracking. It doesn't ask for names, IDs or exact location.","Run the calculations self-test","Self-test","Testing the calculations…","All {total} tests passed.","{n} of {total} tests failed.","Pass","Fail","Skipped","Back to the app"],"c":["Water","For drinking, plus extra for cooking","Food","That can be eaten without a fridge or stove","Radio","Battery-powered or hand-crank, to hear official alerts","Flashlight","With spare batteries","Power bank","Portable and charged, with its cable","Cash","Small bills, in case cards don't work","First aid kit","First aid and essential medication","Documents","Copies and phone numbers written on paper","Other","Whatever your household in particular needs","Baby (under 1 year)","1 to 3 years","4 to 8 years","9 to 13 years","14 to 17 years","Adult (18 to 64)","65 or over","Asthma","Diabetes","High blood pressure","Reduced mobility","Low vision","Hearing loss","Pregnancy","Breastfeeding","Celiac / gluten-free","Food allergy","Depends on electrical equipment","CPAP","Oxygen","Nebulizer","Wheelchair","Hearing aids","Glasses","Dog","Cat","Other","6 L water jug","2 L water bottle","500 ml water bottle","Water purification tablets","Bleach suitable for disinfecting water (no additives)","Ready-to-eat ration","Can of tuna, 170 g","Can of beans, 350 g","Crackers","Nuts, 100 g","Cereal bar","Powdered milk, 400 g","Dry pet food","Battery-powered radio","Hand-crank radio","LED flashlight","Spare AA batteries","Spare AAA batteries","Power bank, 10,000 mAh","Power bank, 20,000 mAh","Envelope with small bills","First aid kit","Oral rehydration salts","Hand sanitizer","Insect repellent","Copies of documents in a waterproof bag","List of phone numbers on paper","ABC fire extinguisher","Manual can opener","Whistle","Matches or lighter","Diapers","Blankets","Carbon monoxide detector","Battery-powered or hand-crank radio","LED flashlight and spare batteries","Charged power bank, with cable","Cash in small bills","Copies of documents and phone numbers written on paper","Generic","Litoral / Northeast Argentina (NEA)","Metropolitan area","Pampas","Cuyo / seismic zone","Patagonia / volcanoes and snow","House","Apartment","Duplex / townhouse","Rural / outskirts","Mains","Mains with tank","Well / borehole","Mains gas","Gas cylinder / tank","I don't use gas","Rotate the stored water","Test flashlight, radio and power bank","Check the first aid kit and medication expiry dates","Check the fire extinguisher (gauge and refill)","Update copies of documents and phone numbers","Run a family drill","Argentina","Uruguay","Chile","Mexico","Colombia","Peru","Spain","United States","Another EU country","Other","Cyberattack on services (water, power, payments, phone)","It can cut several services at once. Prioritize water, cash and radio.","Store water for the number of days you set as your goal.","Keep cash in small bills and phone numbers written on paper.","Agree on meeting points and the communication window as a family.","Get information from the radio and official channels; don't trust chain messages and rumors.","If water is still running, collect some in clean containers before it's cut off.","Use your phone sparingly: short texts rather than calls.","Wait for the official notice before drinking tap water again.","Restock what you used and note what you were missing.","Extended power outage","Without power, the water pump, elevator, fridge and phone charging often fail. Power bank, flashlight and water become more important.","Keep the power bank charged and test the flashlight and radio once a month.","If someone depends on electrical equipment, talk to the power company and their doctor about a backup plan.","If your building uses a pump, store extra water.","Don't open the fridge or freezer unless you need to: closed, the fridge keeps food cold for about 4 hours; a full freezer for about 48 hours (24 if half full).","Use flashlights. If you light candles, never leave them unattended or near curtains.","Never use a generator, brazier, grill or gas cylinder to heat indoors: they produce carbon monoxide.","Unplug sensitive devices to protect them when the power comes back.","Throw away perishable food that has been without refrigeration for more than 4 hours. When in doubt, don't eat it.","Recharge power banks and replace batteries.","Extreme heat","At medium or high level, the calculation adds water: +1 L per person per day (+0.5 L for children under 9) and 25% more for pets.","Add water to your supply and keep oral rehydration salts in the first aid kit.","Find the coolest room in the house.","Drink water often, without waiting until you're thirsty. Offer water to children and older people.","Avoid the sun and physical effort during the hottest hours.","If someone is confused, faints or has very hot, dry skin, call emergency services.","Replace the water you used.","Cold wave or extreme cold","Warm clothes and blankets matter more. The biggest risk at home is carbon monoxide.","Have heaters and water heaters checked by a licensed gas technician.","Keep blankets and warm clothes at hand. Consider a carbon monoxide detector.","Always ventilate any room with a gas heater or brazier. Don't use the stove burners or oven for heating.","Put out braziers and wood stoves before going to sleep.","Headache, dizziness or nausea in a heated room: go outside and call emergency services.","Check the pipes and restock fuel safely.","Severe storm, hail, wind or tornado","It often brings power cuts and flooding. Reinforce flashlight, power bank and documents in a waterproof bag.","Secure or put away anything that could blow away. Clear drains and gutters.","Follow the alerts from your country's weather service.","Stay inside, away from windows. In a tornado or very strong wind, go to the lowest, most interior room.","Don't touch fallen wires or go near poles or trees.","If you're out on the street, don't cross flooded streets.","Check for damage carefully. Tell the power company if there are fallen wires.","Flood or rising water","It may force you to evacuate. Prepare a go-bag, documents in a waterproof bag and Point B outside the area.","Store food, documents and the first aid kit up high.","Find the electricity and gas shut-offs so you can turn them off quickly.","Agree on where to go and which route to take.","Turn off the electricity and gas if water gets in. Move to higher ground or evacuate if the authorities say so.","Don't walk or drive through moving water. Don't touch wet wires or appliances.","Drink only safe water: bottled, boiled or treated.","Floodwater is contaminated: wash and disinfect anything it touched, and treat water before drinking it.","Don't turn the electricity back on until the wiring is dry and has been checked.","House fire","It plays out in minutes: what matters is the way out and Point A, not supplies.","Keep the exits clear. Have an ABC fire extinguisher at hand and learn how to use it.","Don't overload outlets. Agree on two ways out and Point A.","Get out now and call the fire department from outside. Don't go back in.","If there's smoke, stay low. Touch doors before opening them: if they're hot, find another way out.","Don't use the elevator.","Go back in only when the firefighters say so.","Wildfire or wildland-urban interface fire and smoke","You may have to evacuate with little warning. Face masks for smoke and a ready go-bag become more important.","Keep the area around the house clear of dry grass and firewood.","Keep the go-bag ready and two ways out.","If the authorities say to evacuate, do it immediately.","With smoke: stay inside with doors and windows closed, and look after anyone with breathing problems.","Go back only when authorized. Watch out for embers and weakened trees.","Earthquake","It can cut water, power and gas at the same time. Reinforce water, the first aid kit and shoes near the bed.","Secure tall furniture and don't hang heavy objects over beds.","Identify safe spots in each room and where to shut off gas, power and water.","Drop, take cover under a sturdy table and hold on until it stops. Stay away from windows.","Don't use the elevator or run for the exit while it's shaking.","If you smell gas, close the valve, ventilate and get out. Expect aftershocks.","Use short texts: the lines get overloaded.","Volcano and ashfall","Face masks, protective goggles and covered water become more important.","Have face masks and goggles, and a way to cover water tanks and containers.","Stay inside with doors and windows closed. Protect your nose, mouth and eyes if you go out.","Don't drive unless you have to: ash reduces visibility and damages engines.","Remove ash from roofs carefully: it's heavy. Don't wash it down the drains.","Drought or water shortage","The Water pillar matters more: consider the Recommended level and more goal days.","Increase your supply and fix leaks.","Have a way to make water safe to drink.","Prioritize water for drinking and cooking. Reuse water for the toilet.","Follow your water supplier's restrictions.","Replenish your supply.","Gas leak or carbon monoxide","It doesn't change the quantities: it's a matter of minutes. Add a carbon monoxide detector.","Have gas appliances checked every year by a licensed gas technician.","Keep ventilation grilles clear. The flame should be blue.","Smell of gas: don't turn on lights or light anything, open doors and windows, close the valve and get out. Call from outside.","Carbon monoxide has no smell. Headache, dizziness or nausea: go outside and call emergency services.","Don't use the appliance again until a professional has checked it.","Internet and phone outage","This is the case the “zero communication” plan is for: meeting points and the radio window.","Write down important phone numbers on paper.","Agree on meeting points and how often to try to get in touch.","Try texting: texts often get through when calls don't.","Listen to the radio during the agreed window. Follow the plan without waiting for confirmation.","Check which part of the plan wasn't understood and practice it.","Civil unrest or instability","It can disrupt supplies for a few days. Food and cash become more important.","Keep your supplies up to date so you don't depend on going out to shop.","Stay home if it's safe. Avoid areas of conflict.","Get information from official channels.","Restock gradually, without panic buying.","Disease outbreak","Hygiene items, and repellent where there are mosquitoes, become more important. It may mean staying home for several days.","Have soap, hand sanitizer, face masks and repellent.","Get rid of containers with standing water.","Follow the instructions of the health system in your area.","If you have symptoms, see a health professional: don't self-medicate.","Restock the first aid kit.","Hazardous materials release","The instruction may be to evacuate or to shelter in place: define both options in your plan.","Find out whether there are industries, warehouses or freight routes nearby.","Follow the official instruction: evacuate or stay inside.","If you're told to stay inside: close doors and windows and turn off ventilation and air conditioning.","Don't go back or air the house out until the official notice.","Doesn't apply","Low","Medium","High","First 10 minutes","First hour","First 24 hours","Up to 72 hours","Power outage","Find the flashlight. Avoid candles.","Check whether the outage is only in your home (breaker, safety switch) or on the whole block.","Unplug sensitive devices.","Keep the fridge and freezer closed.","Put phones in power-saving mode.","If your building uses a pump, collect water while there's still some in the tank.","If someone depends on electrical equipment, start their backup plan.","Turn on the radio during the agreed window.","After 4 hours, don't eat perishable food from the fridge.","Never use a generator, brazier or grill indoors.","Ration the battery: one phone on at a t "Reponha o que você usou e anote o que faltou.","Apagão prolongado","Sem luz, costumam falhar a bomba d'água, o elevador, a geladeira e a carga do celular. Bateria, lanterna e água ganham peso.","Mantenha a bateria portátil carregada e teste a lanterna e o rádio uma vez por mês.","Se alguém depende de um equipamento elétrico, converse com a distribuidora de energia e com o médico sobre um plano alternativo.","Se o seu prédio usa bomba, guarde água extra.","Não abra a geladeira nem o freezer sem necessidade: fechada, a geladeira conserva por umas 4 horas; o freezer cheio, por umas 48 horas (24 se estiver pela metade).","Use lanternas. Se acender velas, nunca as deixe sem supervisão nem perto de cortinas.","Nunca use gerador, braseiro, churrasqueira nem botijão para aquecer ambientes fechados: eles produzem monóxido de carbono.","Desligue da tomada os aparelhos sensíveis para protegê-los quando a energia voltar.","Jogue fora os alimentos perecíveis que ficaram mais de 4 horas sem refrigeração. Na dúvida, não coma.","Recarregue as baterias e reponha as pilhas.","Calor extremo","Com nível médio ou alto, o cálculo soma água: +1 L por pessoa por dia (+0,5 L para menores de 9 anos) e 25% a mais para os animais.","Aumente sua reserva de água e tenha sais de reidratação oral no kit de primeiros socorros.","Identifique o cômodo mais fresco da casa.","Beba água com frequência, sem esperar ter sede. Ofereça água às crianças e às pessoas idosas.","Evite o sol e o esforço nas horas mais quentes.","Em caso de confusão, desmaio ou pele muito quente e seca, ligue para a emergência.","Reponha a água usada.","Onda de frio ou frio extremo","Agasalhos e cobertores ganham peso. O maior risco em casa é o monóxido de carbono.","Peça a um técnico de gás credenciado que revise aquecedores e aquecedores de água.","Tenha cobertores e agasalhos à mão. Considere um detector de monóxido de carbono.","Sempre ventile o cômodo onde houver aquecedor a gás ou braseiro. Não use as bocas do fogão nem o forno para aquecer.","Apague braseiros e lareiras a lenha antes de dormir.","Dor de cabeça, tontura ou náusea em um ambiente aquecido: saia ao ar livre e ligue para a emergência.","Revise os encanamentos e reponha o combustível com segurança.","Tempestade forte, granizo, vendaval ou tornado","Costuma trazer faltas de luz e alagamentos. Reforce lanterna, bateria e documentos em saco impermeável.","Prenda ou guarde o que possa voar. Limpe ralos e calhas.","Siga os alertas do serviço meteorológico do seu país.","Fique dentro de casa, longe das janelas. Com tornado ou vento muito forte, vá para o cômodo mais interno e mais baixo.","Não toque em fios caídos nem se aproxime de postes ou árvores.","Se estiver na rua, não atravesse ruas alagadas.","Verifique os danos com cuidado. Avise a distribuidora de energia se houver fios caídos.","Enchente ou cheia","Pode obrigar você a sair de casa. Prepare a mochila, os documentos em saco impermeável e o Ponto B fora da área.","Guarde comida, documentos e o kit de primeiros socorros em lugares altos.","Localize o disjuntor geral e o registro do gás para desligá-los rápido.","Combinem para onde ir e por qual caminho.","Desligue a luz e o gás se a água entrar. Suba para um lugar alto ou saia se as autoridades indicarem.","Não ande nem dirija por água em movimento. Não toque em fios nem aparelhos molhados.","Beba só água segura: engarrafada, fervida ou tratada.","A água da enchente está contaminada: lave e desinfete o que ela tocou, e trate a água antes de bebê-la.","Não religue a eletricidade até que a instalação esteja seca e revisada.","Incêndio na casa","Resolve-se em minutos: o que conta é a saída e o Ponto A, não os mantimentos.","Mantenha as saídas livres. Tenha um extintor ABC à mão e aprenda a usá-lo.","Não sobrecarregue tomadas. Combinem duas saídas e o Ponto A.","Saia já e ligue para os bombeiros de fora. Não volte a entrar.","Se houver fumaça, avance abaixado. Toque nas portas antes de abrir: se estiverem quentes, procure outra saída.","Não use o elevador.","Entre só quando os bombeiros autorizarem.","Incêndio florestal ou de interface e fumaça","Pode exigir sair de casa com pouco aviso. Máscaras contra fumaça e mochila pronta ganham peso.","Mantenha o entorno da casa livre de mato seco e lenha.","Tenha a mochila pronta e dois caminhos de saída.","Se as autoridades mandarem evacuar, faça isso imediatamente.","Com fumaça: fique dentro de casa com portas e janelas fechadas e cuide de quem tem problemas respiratórios.","Volte só com autorização. Cuidado com brasas e árvores enfraquecidas.","Terremoto","Pode cortar água, luz e gás ao mesmo tempo. Reforce água, kit de primeiros socorros e calçados perto da cama.","Fixe os móveis altos e não pendure objetos pesados sobre as camas.","Identifique lugares seguros em cada cômodo e onde se desligam o gás, a luz e a água.","Abaixe-se, proteja-se embaixo de uma mesa firme e segure-se até parar. Afaste-se das janelas.","Não use o elevador nem corra para a saída enquanto treme.","Se sentir cheiro de gás, feche o registro, ventile e saia. Espere réplicas.","Use mensagens curtas: as linhas ficam congestionadas.","Vulcão e queda de cinzas","Máscaras, óculos de proteção e água tampada ganham peso.","Tenha máscaras e óculos, e como tampar caixas e reservatórios de água.","Fique dentro de casa com portas e janelas fechadas. Proteja nariz, boca e olhos se sair.","Não dirija, a não ser que seja necessário: a cinza reduz a visibilidade e danifica o motor.","Retire a cinza dos telhados com cuidado: ela é pesada. Não a jogue nos ralos.","Seca ou falta de água","O pilar Água ganha peso: considere o nível Recomendado e mais dias de meta.","Aumente sua reserva e conserte vazamentos.","Tenha como tratar a água para beber.","Priorize a água para beber e cozinhar. Reaproveite água para o vaso sanitário.","Siga as restrições da sua empresa de água.","Reponha a reserva.","Vazamento de gás ou monóxido de carbono","Não muda as quantidades: é um risco de minutos. Inclua um detector de monóxido.","Peça a um técnico de gás credenciado que revise os aparelhos a gás todos os anos.","Mantenha as grades de ventilação livres. A chama deve ser azul.","Cheiro de gás: não acenda luzes nem fogo, abra portas e janelas, feche o registro e saia. Ligue de fora.","O monóxido não tem cheiro. Dor de cabeça, tontura ou náusea: saia ao ar livre e ligue para a emergência.","Não volte a usar o aparelho até que um profissional o revise.","Queda de internet e telefonia","É o caso para o qual serve o plano de “zero comunicação”: pontos de encontro e janela de rádio.","Anote os telefones importantes no papel.","Combinem pontos de encontro e de quanto em quanto tempo tentar se comunicar.","Tente por SMS: costumam passar quando as ligações não completam.","Ouça o rádio na janela combinada. Cumpra o plano sem esperar confirmação.","Veja qual parte do plano não foi entendida e pratique.","Distúrbios ou instabilidade","Pode complicar o abastecimento por alguns dias. Comida e dinheiro ganham peso.","Mantenha seu estoque em dia para não depender de sair para comprar.","Fique em casa se for seguro. Evite as áreas de conflito.","Informe-se pelos canais oficiais.","Reponha aos poucos, sem compras de pânico.","Surto de doença","Itens de higiene e repelente, onde houver mosquitos, ganham peso. Pode exigir ficar em casa vários dias.","Tenha sabonete, álcool em gel, máscaras e repelente.","Elimine recipientes com água parada.","Siga as orientações do sistema de saúde da sua região.","Se tiver sintomas, procure atendimento: não se automedique.","Reponha o kit de primeiros socorros.","Vazamento de materiais perigosos","A orientação pode ser sair de casa ou se abrigar dentro dela: defina as duas opções no seu plano.","Descubra se há indústrias, depósitos ou rotas de carga por perto.","Siga a orientação oficial: sair ou ficar dentro de casa.","Se a orientação for ficar: feche portas e janelas e desligue a ventilação e o ar-condicionado.","Não volte nem ventile até o aviso oficial.","Não se aplica","Baixo","Médio","Alto","Primeiros 10 minutos","Primeira hora","Primeiras 24 horas","Até 72 horas","Apagão","Pegue a lanterna. Evite velas.","Veja se a falta de luz é só na sua casa (disjuntor, DR) ou na rua toda.","Desligue da tomada os aparelhos sensíveis.","Mantenha a geladeira e o freezer fechados.","Coloque os celulares em modo de economia.","Se o seu prédio usa bomba, junte água enquanto ainda houver na caixa-d'água.","Se alguém depende de um equipamento elétrico, ative o plano alternativo dessa pessoa.","Ligue o rádio na janela combinada.","Depois de 4 horas, não coma os perecíveis da geladeira.","Nunca use gerador, braseiro nem churrasqueira dentro de casa.","Economize a bateria: um celular ligado de cada vez.","Veja quanta água e comida restam e ajuste as porções.","Encontrar as lanternas no escuro","Desligar o disjuntor geral","Colocar os celulares em modo de economia","Sintonizar o rádio","Reunir-se no lugar combinado da casa","Falta de água ou de vários serviços","Se ainda estiver saindo água, encha recipientes limpos, panelas e galões.","Conte quanta água segura você tem.","Separe a água para beber da água para higiene.","Informe-se pelo rádio ou pelos canais oficiais sobre a causa e a duração.","Se os pagamentos também falharem, use o dinheiro só para o essencial.","Use água segura para beber, cozinhar e escovar os dentes.","Se tiver dúvida sobre a água, ferva ou trate conforme o rótulo do produto.","Reaproveite água para o vaso sanitário.","Descubra onde estão distribuindo água segura.","Revise as porções e cuide para que ninguém beba menos do que precisa.","Juntar e contar toda a água segura da casa","Encher dois recipientes limpos","Localizar as pastilhas ou a água sanitária apropriada","Repassar quem vai buscar água e onde","Enchente","Desligue a luz e o gás se a água entrar.","Leve documentos, medicamentos e celulares para um lugar alto ou para a mochila.","Reúna todas as pessoas e animais.","Se as autoridades mandarem evacuar, vá até o ponto combinado pelo caminho mais alto.","Não ande nem dirija por água em movimento.","Não toque em fios nem aparelhos molhados.","Beba só água engarrafada, fervida ou tratada.","Avise seu contato fora da região onde você está.","Antes de voltar, espere o aviso oficial.","Limpe e desinfete o que a água tocou. Não religue a luz até que esteja seco e revisado.","Desligar a luz e o gás","Levar documentos e medicamentos para o alto","Arrumar as mochilas","Reunir pessoas e animais na porta","Chegar ao Ponto A","Incêndio em casa","Saiam todos já. Não peguem coisas.","Se houver fumaça, avancem abaixados. Não usem o elevador.","Ligue para os bombeiros de fora.","Reúnam-se no Ponto A e confiram se estão todos.","Não volte a entrar.","Avise os bombeiros se faltar alguém e onde a pessoa pode estar.","Socorra quem respirou fumaça: ligue para a emergência médica.","Entre só com autorização dos bombeiros.","Avise seu contato fora da região.","Dar o alarme","Sair pelo caminho combinado","Conferir se estão todos","Ofereça água a todos, primeiro aos bebês, às crianças e às pessoas idosas.","Abaixe as persianas e feche do lado do sol.","Fiquem no cômodo mais fresco. Roupa leve.","Molhe panos ou tome banhos frescos se houver água.","Beba água com frequência, sem esperar a sede.","Evite esforço e o sol do meio-dia.","Confusão, desmaio ou pele muito quente: ligue para a emergência.","Revise a reserva de água: com calor, gasta-se mais.","Pergunte como estão seus vizinhos idosos ou que moram sozinhos.","Reunir a água disponível","Preparar o cômodo mais fresco","Repassar os sinais de alerta do calor","Enquanto treme: abaixe-se, proteja-se e segure-se. Longe das janelas.","Quando parar: calce sapatos e veja se há pessoas feridas.","Cheiro de gás: feche o registro, ventile e saia.","Saia com calma pela escada se o prédio estiver danificado.","Vá ao Ponto A. Espere réplicas.","Mande uma mensagem curta ao seu contato fora da região.","Não entre em prédios danificados.","Ouça o rádio na janela combinada.","Revise água e comida. Use água segura.","Abaixar-se, proteger-se e segurar-se","Fechar o gás","Pegar a mochila","Sair pela escada","Tempestade forte","Entre e afaste-se das janelas.","Recolha ou prenda o que possa voar, se der tempo.","Com vento muito forte, fique no cômodo mais interno.","Tenha à mão lanterna, rádio e bateria.","Não toque em fios caídos nem atravesse ruas alagadas.","Revise telhados e ralos quando passar.","Se continuar sem luz, siga os passos de Apagão.","Guardar o que possa voar","Fechar persianas e janelas","Reunir-se no cômodo interno","Ter lanterna e rádio à mão","Vazamento de gás ou monóxido","Não acenda luzes, fogo nem aparelhos.","Abra portas e janelas.","Feche o registro do gás se puder fazer isso rápido.","Saiam todos para o ar livre.","Ligue para a emergência de fora.","Dor de cabeça, tontura ou náusea: procure atendimento médico.","Não volte a entrar até que façam a revisão.","Peça a um técnico de gás credenciado que revise a instalação antes de usá-la.","Abrir portas e janelas","Fechar o registro do gás","Saírem todos","Evacuação","Pegue as mochilas, documentos, medicamentos, dinheiro e chaves.","Desligue o gás e a luz se der tempo.","Saia pela rota indicada pelas autoridades.","Vá ao ponto de encontro combinado.","Registre-se no abrigo se for para um.","Economize água, comida e bateria.","Volte só com aviso oficial.","Pegar mochilas e documentos","Desligar gás e luz","Reunir pessoas e animais","Trancar a casa","Desligar gás e luz; pegar documentos e dinheiro","Quadro de luz e registro do gás","Assim que decidirmos sair","Reunir as crianças e os animais; levar o kit de primeiros socorros e água","Porta principal","Se não estivermos juntos: ir ao Ponto A e esperar","Ponto A","Sem contato por 1 hora","Pegar as lanternas e revisar o quadro de luz","Quadro de luz","Quando faltar luz","Colocar os celulares em modo de economia e ligar o rádio","Cozinha","Aos 10 minutos","Encher recipientes limpos","Cozinha e banheir et {pets} · objectif de {days} jours","Autonomie actuelle : {days} jours","Sauvegarde","Vos données vivent uniquement sur ce téléphone. S'il casse, se perd ou si vous effacez les données du navigateur, elles disparaissent. Faites une sauvegarde et transférez-la sur les autres téléphones du foyer.","Exporter chiffré (.fsbackup)","Exporter non chiffré (.json)","Importer une sauvegarde","Copier le plan en texte","Exporter","Sauvegarde téléchargée.","Exporter sans chiffrement ?","Toute personne qui ouvre le fichier pourra le lire, y compris les médicaments et le liquide si vous les avez saisis. Pour l'envoyer par messagerie, mieux vaut la sauvegarde chiffrée.","Le fichier est chiffré en AES-GCM 256 bits ; la clé est dérivée de votre phrase secrète avec PBKDF2 ({iter} itérations).","Sauvegarde chiffrée","Ouvrir","Vérifiez avant d'importer","Sauvegarde","Actuel","Personnes","Animaux","Produits","Tâches","Contacts","Exercices","Remplacer efface ce que vous avez et garde la sauvegarde. Fusionner conserve l'existant et ajoute ce qui manque. Les réglages de ce téléphone ne changent pas.","Tout remplacer","Fusionner","Sauvegarde importée.","Sauvegarde fusionnée avec vos données.","C'est une sauvegarde de la version précédente. Elle a été convertie au nouveau format : les quantités des réserves étaient du texte libre, vérifiez-les. S'il s'agissait de la démonstration d'origine, ce sont des données d'exemple.","Cette sauvegarde est marquée comme données d'exemple.","Le fichier est vide.","Le fichier dépasse 1 Mo : ce n'est pas une sauvegarde FamSurvivor.","Le fichier est endommagé ou n'est pas une sauvegarde : il n'a pas pu être lu.","Le fichier n'a pas le format d'une sauvegarde FamSurvivor.","Nous ne reconnaissons pas ce fichier comme une sauvegarde FamSurvivor.","Il manque des parties à la sauvegarde (foyer, membres ou réserves). Rien n'a été importé.","Cette sauvegarde vient d'une version plus récente de l'application. Mettez FamSurvivor à jour et réessayez.","Le fichier n'a pas pu être lu.","Confidentialité","Chiffrement activé","Non chiffré","Ce qui est enregistré sur ce téléphone est chiffré. La clé n'existe que tant que l'application est déverrouillée.","Les données sont enregistrées sur ce téléphone sans chiffrement : quiconque le déverrouille et ouvre le navigateur pourrait les lire. Vous pouvez les protéger avec une phrase secrète.","Activer le chiffrement","Changer la phrase secrète","Protéger avec une phrase secrète","Utilise AES-GCM 256 bits et PBKDF2 avec {iter} itérations. Vous taperez la phrase à chaque ouverture de l'application.","Phrase secrète","Utilisez quatre mots ou plus. Un code PIN court peut être deviné en essayant des combinaisons si quelqu'un copie vos données.","Répétez la phrase secrète","Je comprends que si j'oublie la phrase, il n'y a aucun moyen de récupérer les données","Confirmez que vous avez compris.","Les deux phrases ne correspondent pas.","Elle est trop courte ou ne contient que des chiffres. Utilisez au moins 8 caractères ; mieux, quatre mots.","La phrase n'est pas correcte.","Chiffrement activé.","Retirer le chiffrement","Retirer le chiffrement ?","Les données seront de nouveau enregistrées sans chiffrement sur ce téléphone.","Chiffrement retiré.","Verrouiller maintenant","Verrouiller après inactivité de","{n} min","Verrouiller en quittant l'application plus de 30 secondes","Pendant une urgence en cours, l'application ne se verrouille pas seule, pour que vous ne perdiez pas la liste.","Masquer les données sensibles à l'écran","Cache la santé, les médicaments et le liquide jusqu'à ce que vous touchiez « Afficher les données ». Ce n'est pas du chiffrement : cela évite seulement les regards.","Ce navigateur, ou cette façon d'ouvrir l'application, ne propose pas le chiffrement (HTTPS nécessaire). Les sauvegardes chiffrées ne sont pas disponibles ici.","Effacer toutes les données","Tout effacer ?","Tout ce qui a été saisi sur ce téléphone est supprimé. C'est irréversible. Pour le conserver, exportez d'abord une sauvegarde.","Données effacées.","Vos données sont chiffrées. Saisissez votre phrase secrète pour les ouvrir.","Déverrouiller","Vérification…","Trop de tentatives. Attendez {s} secondes.","Sans la phrase, il n'y a aucun moyen de récupérer les données. Si vous l'avez perdue, effacez les données du site dans le navigateur et importez une sauvegarde.","Apparence","Mode d'affichage","Automatique","Jour","Nuit","Économie de batterie","Automatique suit le téléphone : jour quand il fait clair, nuit dans le noir. Jour se lit mieux au soleil. Économie de batterie utilise le noir pur et coupe ombres et animations : sur les écrans OLED, il consomme nettement moins.","Conçu par","Langue","Change les textes de l'application. Ce que vous avez écrit reste tel quel.","unité","unités","L","L","kg","kg","ration","rations","conserve","conserves","paquet","paquets","boîte","boîtes","paire","paires","Texte agrandi","Plus de contraste","Installation et version","Installer FamSurvivor","Installée sur cet appareil","Sur Android : ouvrez le menu du navigateur et choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».","Sur iPhone ou iPad : ouvrez-la dans Safari, touchez Partager et choisissez « Sur l'écran d'accueil ».","Version","contenu {v}","Stockage","Sur ce téléphone (IndexedDB)","Sur ce téléphone (stockage simple)","En mémoire seulement : perdu à la fermeture","protégé contre le nettoyage automatique","le navigateur pourrait l'effacer en cas de manque de place","Hors ligne","Prête à être utilisée hors ligne","Pas encore : ouvrez-la une fois de plus avec une connexion","Non disponible dans la version en un seul fichier","Rechercher une mise à jour","Mettre à jour","Une nouvelle version est disponible. Vos données ne sont pas touchées.","Vous avez déjà la dernière version.","La recherche a échoué. Réessayez avec une connexion.","L'application n'utilise ni notifications push, ni statistiques, ni services tiers.","Sources et méthode de calcul","Contenu vérifié le {date}. Chaque chiffre indique d'où il vient et s'il a pu être recoupé avec la source officielle.","Formules","Sources","Ouvrir la source","Les liens s'ouvrent dans le navigateur et nécessitent une connexion. L'application elle-même ne se connecte à aucun site.","Eau par personne et par jour : {adult} L à boire dès 9 ans, + 1 L pour cuisiner, + {heat} L si vous avez indiqué une forte chaleur au niveau moyen ou élevé, + {hyg} L d'hygiène au niveau Recommandé. La grossesse ajoute 0,5 L et l'allaitement 1 L.","Enfants : bébés {a} L (y compris l'eau pour préparer leurs repas), de 1 à 3 ans {b} L, de 4 à 8 ans {c} L, plus 1 L pour cuisiner dès 1 an. Avec la chaleur, +0,5 L.","Animaux : chiens {dog} ml par kg et par jour, chats {cat} ml par kg, avec un minimum de {min} L. Par forte chaleur, 25 % de plus.","Nourriture : {kcal} kcal par personne et par jour dès 9 ans ; 1 400 de 4 à 8 ans ; 1 000 de 1 à 3 ans ; 700 pour les bébés. Grossesse +300 et allaitement +500. Une ration = {ration} kcal.","Nourriture des animaux : énergie au repos (70 × poids^0,75) × 1,6 pour les chiens ou 1,2 pour les chats, à {k} kcal par gramme de croquettes. C'est indicatif : consultez le tableau de l'emballage.","Médicaments : jours couverts = unités disponibles ÷ prises par jour. L'application ne suggère jamais de doses.","Énergie : {phone} Wh par téléphone et par jour en mode économie, plus watts × heures de chaque appareil chargé. Pour les batteries externes, on compte {eff} % à cause des pertes.","Liquide : dépense quotidienne estimée × jours de l'objectif.","Autonomie : la plus petite valeur entre l'eau, la nourriture, les médicaments (si saisis), la nourriture des animaux (s'il y en a) et l'énergie (seulement si quelqu'un dépend d'un appareil électrique). Les totaux sont arrondis au supérieur ; les jours, à l'inférieur.","Péremption : périmé, moins de 30 jours, moins de 90 jours ou à jour. Ce qui est périmé ne compte pas dans le stock.","À propos","FamilySurvivor (FamSurvivor) aide tout foyer à se préparer aux coupures d'eau ou d'électricité, aux tempêtes, aux inondations et à d'autres urgences, et à avoir un plan quand il n'y a plus de communication.","Local-first : pas de serveur, pas de compte, pas de pistage. Elle ne demande ni noms, ni pièces d'identité, ni position exacte.","Lancer l'autotest des calculs","Autotest","Test des calculs…","Les {total} tests ont réussi.","{n} tests sur {total} ont échoué.","OK","Échec","Ignoré","Revenir à l'application"],"c":["Eau","Pour boire, plus un supplément pour cuisiner","Nourriture","Qui se mange sans frigo ni cuisson","Radio","À piles ou à manivelle, pour écouter les alertes officielles","Lampe torche","Avec des piles de rechange","Batterie","Externe et chargée, avec son câble","Argent liquide","En petites coupures, au cas où les cartes ne marchent pas","Trousse de secours","Premiers secours et médicaments essentiels","Papiers","Copies et numéros notés sur papier","Autres","Ce qui est utile à votre foyer en particulier","Bébé (moins d'1 an)","1 à 3 ans","4 à 8 ans","9 à 13 ans","14 à 17 ans","Adulte (18 à 64 ans)","65 ans ou plus","Asthme","Diabète","Hypertension","Mobilité réduite","Malvoyance","Malentendance","Grossesse","Allaitement","Maladie cœliaque / sans gluten","Allergie alimentaire","Dépend d'un appareil électrique","PPC (CPAP)","Oxygène","Nébuliseur","Fauteuil roulant","Appareils auditifs","Lunettes","Chien","Chat","Autre","Bidon d'eau de 6 L","Bouteille d'eau de 2 L","Bouteille d'eau de 50 cl","Pastilles de purification d'eau","Eau de Javel adaptée à la désinfection de l'eau (sans additifs)","Ration prête à manger","Boîte de thon de 170 g","Boîte de légumes secs de 350 g","Biscuits salés","Fruits secs, 100 g","Barre de céréales","Lait en poudre, 400 g","Croquettes pour animaux","Radio à piles","Radio à manivelle","Lampe torche LED","Piles AA de rechange","Piles AAA de rechange","Batterie externe de 10 000 mAh","Batterie externe de 20 000 mAh","Enveloppe avec des petites coupures","Trousse de premiers secours","Sels de réhydratation orale","Gel hydroalcoolique","Répulsif anti-insectes","Copies des papiers dans une pochette étanche","Liste de numéros sur papier","Extincteur ABC","Ouvre-boîte manuel","Sifflet","Allumettes ou briquet","Couches","Couvertures","Détecteur de monoxyde de carbone","Radio à piles ou à manivelle","Lampe torche LED et piles de rechange","Batterie externe chargée, avec câble","Argent liquide en petites coupures","Copies des papiers et numéros notés sur papier","Générique","Litoral / Nord-Est argentin (NEA)","Zone métropolitaine","Pampa","Cuyo / zone sismique","Patagonie / volcans et neige","Maison","Appartement","Maison mitoyenne / duplex","Rural / périurbain","Réseau","Réseau avec citerne","Puits / forage","Gaz de ville","Bouteille de gaz","Je n'utilise pas de gaz","Renouveler l'eau stockée","Tester la lampe, la radio et la batterie externe","Vérifier la trousse de secours et les dates des médicaments","Vérifier l'extincteur (manomètre et recharge)","Mettre à jour les copies des papiers et les numéros","Faire un exercice en famille","Argentine","Uruguay","Chili","Mexique","Colombie","Pérou","Espagne","États-Unis","Autre pays de l'UE","Autre","Cyberattaque contre les services (eau, électricité, paiements, téléphone)","Elle peut couper plusieurs services à la fois. Priorité à l'eau, au liquide et à la radio.","Stockez de l'eau pour le nombre de jours que vous vous êtes fixé.","Ayez du liquide en petites coupures et les numéros notés sur papier.","Convenez en famille des points de rendez-vous et du créneau de communication.","Informez-vous par la radio et les canaux officiels ; méfiez-vous des chaînes et des rumeurs.","Si l'eau coule encore, remplissez des récipients propres avant la coupure.","Utilisez le téléphone au strict nécessaire : des messages courts plutôt que des appels.","Attendez l'avis officiel avant de reboire l'eau du robinet.","Remplacez ce que vous avez utilisé et notez ce qui vous a manqué.","Panne d'électricité prolongée","Sans électricité, la pompe à eau, l'ascenseur, le frigo et la recharge du téléphone tombent souvent en panne. La batterie, la lampe et l'eau comptent davantage.","Gardez la batterie externe chargée et testez la lampe et la radio une fois par mois.","Si quelqu'un dépend d'un appareil électrique, parlez avec le fournisseur d'électricité et son médecin d'un plan de secours.","Si votre immeuble utilise une pompe, stockez de l'eau en plus.","N'ouvrez pas le frigo ni le congélateur sans nécessité : fermé, le frigo garde le froid environ 4 heures ; un congélateur plein, environ 48 heures (24 s'il est à moitié plein).","Utilisez des lampes torches. Si vous allumez des bougies, ne les laissez jamais sans surveillance ni près des rideaux.","N'utilisez jamais de groupe électrogène, brasero, barbecue ou bouteille de gaz pour chauffer à l'intérieur : ils produisent du monoxyde de carbone.","Débranchez les appareils sensibles pour les protéger au retour du courant.","Jetez les aliments périssables restés plus de 4 heures sans froid. En cas de doute, ne les mangez pas.","Rechargez les batteries et remplacez les piles.","Chaleur extrême","Au niveau moyen ou élevé, le calcul ajoute de l'eau : +1 L par personne et par jour (+0,5 L pour les moins de 9 ans) et 25 % de plus pour les animaux.","Augmentez votre réserve d'eau et gardez des sels de réhydratation orale dans la trousse de secours.","Repérez la pièce la plus fraîche de la maison.","Buvez souvent, sans attendre d'avoir soif. Proposez de l'eau aux enfants et aux personnes âgées.","Évitez le soleil et les efforts aux heures les plus chaudes.","En cas de confusion, d'évanouissement ou de peau très chaude et sèche, appelez les secours.","Remplacez l'eau utilisée.","Vague de froid ou grand froid","Vêtements chauds et couvertures comptent davantage. Le plus grand risque à la maison est le monoxyde de carbone.","Faites vérifier les poêles et chauffe-eau par un professionnel du gaz qualifié.","Gardez couvertures et vêtements chauds à portée de main. Pensez à un détecteur de monoxyde de carbone.","Aérez toujours la pièce où se trouve un poêle à gaz ou un brasero. N'utilisez pas les feux de cuisson ni le four pour chauffer.","Éteignez braseros et poêles à bois avant d'aller dormir.","Mal de tête, vertiges ou nausées dans une pièce chauffée : sortez à l'air libre et appelez les secours.","Vérifiez les canalisations et refaites le plein de combustible en toute sécurité.","Violent orage, grêle, vent ou tornade","Souvent accompagné de coupures de courant et d'inondations. Renforcez lampe, batterie et papiers en pochette étanche.","Fixez ou rentrez ce qui peut s'envoler. Nettoyez les évacuations et les gouttières.","Suivez les alertes du service météorologique de votre pays.","Restez à l'intérieur, loin des fenêtres. En cas de tornade ou de vent très fort, allez dans la pièce la plus basse et la plus centrale.","Ne touchez pas les câbles tombés et ne vous approchez pas des poteaux ou des arbres.","Si vous êtes dehors, ne traversez pas de rues inondées.","Vérifiez les dégâts avec prudence. Prévenez le fournisseur d'électricité s'il y a des câbles tombés.","Inondation ou crue","Elle peut vous obliger à évacuer. Préparez le sac, les papiers en pochette étanche et le point B hors de la zone.","Rangez la nourriture, les papiers et la trousse de secours en hauteur.","Repérez le disjoncteur et le robinet de gaz pour les couper vite.","Convenez d'où aller et par quel chemin.","Coupez l'électricité et le gaz si l'eau entre. Montez en hauteur ou évacuez si les autorités le demandent.","Ne marchez pas et ne conduisez pas dans l'eau en mouvement. Ne touchez pas de câbles ni d'appareils mouillés.","Ne buvez que de l'eau sûre : en bouteille, bouillie ou traitée.","L'eau de crue est contaminée : lavez et désinfectez ce qu'elle a touché, et rendez l'eau potable avant de la boire.","Ne remettez pas l'électricité avant que l'installation soit sèche et vérifiée.","Incendie dans le logement","Tout se joue en quelques minutes : ce qui compte, c'est la sortie et le point A, pas les provisions.","Gardez les sorties dégagées. Ayez un extincteur ABC à portée de main et apprenez à l'utiliser.","Ne surchargez pas les prises. Convenez de deux sorties et du point A.","Sortez tout de suite et appelez les pompiers de l'extérieur. Ne rentrez pas.","S'il y a de la fumée, avancez baissé. Touchez les portes avant de les ouvrir : si elles sont chaudes, cherchez une autre sortie.","N'utilisez pas l'ascenseur.","Ne rentrez que lorsque les pompiers l'autorisent.","Feu de forêt ou d'interface et fumée","Il peut falloir évacuer avec peu de préavis. Masques contre la fumée et sac prêt comptent davantage.","Gardez les abords de la maison dégagés d'herbe sèche et de bois.","Ayez le sac prêt et deux chemins de sortie.","Si les autorités demandent d'évacuer, faites-le immédiatement.","Avec de la fumée : restez à l'intérieur, portes et fenêtres fermées, et veillez sur les personnes qui ont des problèmes respiratoires.","Ne revenez qu'avec autorisation. Attention aux braises et aux arbres fragilisés.","Séisme","Il peut couper l'eau, l'électricité et le gaz en même temps. Renforcez l'eau, la trousse de secours et des chaussures près du lit.","Fixez les meubles hauts et n'accrochez pas d'objets lourds au-dessus des lits.","Repérez les endroits sûrs de chaque pièce et où couper le gaz, l'électricité et l'eau.","Baissez-vous, abritez-vous sous une table solide et tenez-vous jusqu'à la fin des secousses. Éloignez-vous des fenêtres.","N'utilisez pas l'ascenseur et ne courez pas vers la sortie pendant les secousses.","Si vous sentez une odeur de gaz, fermez le robinet, aérez et sortez. Attendez-vous à des répliques.","Utilisez des messages courts : les lignes sont saturées.","Volcan et chute de cendres","Masques, lunettes de protection et eau couverte comptent davantage.","Ayez des masques et des lunettes, et de quoi couvrir les citernes et réservoirs d'eau.","Restez à l'intérieur, portes et fenêtres fermées. Protégez le nez, la bouche et les yeux si vous sortez.","Ne conduisez qu'en cas de nécessité : la cendre réduit la visibilité et abîme le moteur.","Retirez la cendre des toits avec prudence : elle est lourde. Ne la jetez pas dans les évacuations.","Sécheresse ou pénurie d'eau","Le pilier Eau compte davantage : envisagez le niveau Recommandé et plus de jours d'objectif.","Augmentez votre réserve et réparez les fuites.","Ayez de quoi rendre l'eau potable.","Réservez l'eau en priorité à la boisson et à la cuisine. Réutilisez l'eau pour les toilettes.","Respectez les restrictions de votre fournisseur d'eau.","Reconstituez la réserve.","Fuite de gaz ou monoxyde de carbone","Cela ne change pas les quantités : c'est un risque de quelques minutes. Ajoutez un détecteur de monoxyde.","Faites vérifier les appareils à gaz chaque année par un professionnel qualifié.","Gardez les grilles d'aération dégagées. La flamme doit être bleue.","Odeur de gaz : n'allumez ni lumière ni flamme, ouvrez portes et fenêtres, fermez le robinet et sortez. Appelez de l'extérieur.","Le monoxyde n'a pas d'odeur. Mal de tête, vertiges ou nausées : sortez à l'air libre et appelez les secours.","N'utilisez plus l'appareil avant qu'un professionnel l'ait vérifié.","Panne d'internet et de téléphone","C'est le cas pour lequel sert le plan « zéro communication » : points de rendez-vous et créneau radio.","Notez les numéros importants sur papier.","Convenez des points de rendez-vous et de la fréquence des tentatives de contact.","Essayez les SMS : ils passent souvent quand les appels ne passent pas.","Écoutez la radio pendant le créneau convenu. Suivez le plan sans attendre de confirmation.","Voyez quelle partie du plan n'a pas été comprise et entraînez-vous.","Troubles ou instabilité","Ils peuvent perturber l'approvisionnement quelques jours. Nourriture et liquide comptent davantage.","Gardez vos réserves à jour pour ne pas dépendre des courses.","Restez chez vous si c'est sûr. Évitez les zones de conflit.","Informez-vous par les canaux officiels.","Reconstituez peu à peu, sans achats de panique.","Épidémie","Articles d'hygiène et répulsif, là où il y a des moustiques, comptent davantage. Il peut falloir rester chez soi plusieurs jours.","Ayez du savon, du gel hydroalcoolique, des masques et du répulsif.","Éliminez les récipients d'eau stagnante.","Suivez les consignes du système de santé de votre zone.","En cas de symptômes, consultez : ne vous soignez pas seul.","Complétez la trousse de secours.","Fuite de matières dangereuses","La consigne peut être d'évacuer ou de se mettre à l'abri : définissez les deux options dans votre plan.","Renseignez-vous sur les industries, entrepôts ou axes de transport de marchandises à proximité.","Suivez la consigne officielle : évacuer ou rester à l'intérieur.","Si l'on vous dit de rester : fermez portes et fenêtres et coupez la ventilation et la climatisation.","Ne revenez pas et n'aérez pas avant l'avis officiel.","Sans objet","Faible","Moyen","Élevé","10 premières minutes","Première heure","24 premières heures","Jusqu'à 72 heures","Panne de courant","Prenez la lampe torche. Évitez les bougies.","Vérifiez si la coupure ne touche que votre logement (disjoncteur, différentiel) ou toute la rue.","Débranchez les appareils sensibles.","Gardez le frigo et le congélateur fermés.","Mettez les téléphones en mode économie.","Si votre immeuble utilise une pompe, recueillez de l'eau tant qu'il en reste dans la citerne.","Si quelqu'un dépend d'un appareil électrique, lancez son plan de secours.","Allumez la radio pendant le créneau convenu.","Au-delà de 4 heures, ne mangez pas les produits périssables du frigo.","N'utilisez jamais de groupe électrogène, brasero ou barbecue à l'intérieur.","Économisez la batterie : un seul téléphone allumé à la fois.","Vérifiez combien d'eau et de nourriture il reste et ajustez les rations.","Trouver les lampes dans le noir","Couper le disjoncteur général","Mettre les téléphones en mode économie","Régler la radio","Se retrouver à l'endroit convenu dans la maison","Coupure d'eau ou de plusieurs services","Si l'eau coule encore, remplissez des récipients propres, des casseroles et des bidons.","Comptez combien d'eau sûre vous avez.","Séparez l'eau à boire de l'eau pour l'hygiène.","Informez-vous par la radio ou les canaux officiels sur la cause et la durée.","Si les paiements ne fonctionnent pas non plus, gardez le liquide pour l'essentiel.","Utilisez de l'eau sûre pour boire, cuisiner et vous brosser les dents.","En cas de doute sur l'eau, faites-la bouillir ou traitez-la selon l'étiquette du produit.","Réutilisez l'eau pour les toilettes.","Renseignez-vous sur les lieux de distribution d'eau sûre.","Vérifiez les rations et veillez à ce que personne ne boive trop peu.","Rassembler et compter toute l'eau sûre de la maison","Remplir deux récipients propres","Trouver les pastilles ou l'eau de Javel adaptée","Revoir qui va chercher de l'eau et où","Inondation","Coupez l'électricité et le gaz si l'eau entre.","Montez papiers, médicaments et téléphones en hauteur ou mettez-les dans le sac.","Rassemblez toutes les personnes et les animaux.","Si les autorités demandent d'évacuer, rejoignez le point convenu par le chemin le plus haut.","Ne marchez pas et ne conduisez pas dans l'eau en mouvement.","Ne touchez pas de câbles ni d'appareils mouillés.","Ne buvez que de l'eau en bouteille, bouillie ou traitée.","Dites à votre contact hors de la zone où vous êtes.","Attendez l'avis officiel avant de revenir.","Nettoyez et désinfectez ce que l'eau a touché. Ne remettez pas l'électricité avant que tout soit sec et vérifié.","Couper l'électricité et le gaz","Monter papiers et médicaments en hauteur","Préparer les sacs","Rassembler personnes et animaux à la porte","Rejoindre le point A","Incendie à la maison","Sortez tous tout de suite. Ne prenez rien.","S'il y a de la fumée, avancez baissés. N'utilisez pas l'ascenseur.","Appelez les pompiers de l'extérieur.","Retrouvez-vous au point A et vérif o o tornado",impact:2,scenario:"tormenta",effect:"Suele traer cortes de luz y anegamientos. Reforzá linterna, batería y documentos en bolsa estanca.",before:["Asegurá o guardá lo que pueda volarse. Limpiá desagües y canaletas.","Seguí los alertas del servicio meteorológico de tu país."],during:["Quedate adentro, lejos de ventanas. Con tornado o viento muy fuerte, andá al ambiente más interior y bajo.","No toques cables caídos ni te acerques a postes o árboles.","Si estás en la calle, no cruces calles anegadas."],after:["Revisá daños con cuidado. Avisá a la distribuidora si hay cables caídos."],src:["general"]},{id:"inundacion",label:"Inundación o crecida",impact:3,scenario:"inundacion",effect:"Puede obligarte a evacuar. Prepará mochila, documentos en bolsa estanca y el Punto B fuera de la zona.",before:["Guardá comida, documentos y botiquín en lugares altos.","Ubicá la llave de luz y la de gas para cortarlas rápido.","Acordá a dónde ir y por qué camino."],during:["Cortá la luz y el gas si entra agua. Subí a un lugar alto o evacuá si las autoridades lo indican.","No camines ni manejes por agua en movimiento. No toques cables ni artefactos mojados.","Tomá solo agua segura: embotellada, hervida o tratada."],after:["El agua de inundación está contaminada: lavá y desinfectá lo que tocó, y potabilizá el agua antes de tomarla.","No conectes la electricidad hasta que la instalación esté seca y revisada."],src:["ar_agua","general"]},{id:"incendio_viv",label:"Incendio en la vivienda",impact:3,scenario:"incendio",effect:"Se resuelve en minutos: lo que cuenta es la salida y el Punto A, no las provisiones.",before:["Mantené libres las salidas. Tené un matafuegos ABC a mano y aprendé a usarlo.","No sobrecargues enchufes. Acordá dos salidas y el Punto A."],during:["Salí ya y llamá a los bomberos desde afuera. No vuelvas a entrar.","Si hay humo, avanzá agachado. Tocá las puertas antes de abrir: si están calientes, buscá otra salida.","No uses el ascensor."],after:["Entrá solo cuando los bomberos lo autoricen."],src:["general"]},{id:"forestal",label:"Incendio forestal o de interfase y humo",impact:3,scenario:"evacuacion",effect:"Puede exigir evacuar con poco aviso. Suma barbijos para el humo y mochila lista.",before:["Mantené despejado de pasto seco y leña el entorno de la casa.","Tené la mochila lista y dos caminos de salida."],during:["Si las autoridades indican evacuar, hacelo de inmediato.","Con humo: quedate adentro con puertas y ventanas cerradas, y cuidá a quienes tienen problemas respiratorios."],after:["Volvé solo con autorización. Cuidado con brasas y árboles debilitados."],src:["general"]},{id:"sismo",label:"Sismo",impact:3,scenario:"sismo",effect:"Puede cortar agua, luz y gas a la vez. Reforzá agua, botiquín y calzado cerca de la cama.",before:["Fijá muebles altos y no cuelgues objetos pesados sobre las camas.","Identificá lugares seguros en cada ambiente y dónde se cortan gas, luz y agua."],during:["Agachate, cubrite bajo una mesa firme y agarrate hasta que pare. Alejate de ventanas.","No uses ascensor ni corras hacia la salida mientras tiembla."],after:["Si sentís olor a gas, cortá la llave, ventilá y salí. Esperá réplicas.","Usá mensajes cortos: las líneas se saturan."],src:["general"]},{id:"volcan",label:"Volcán y caída de ceniza",impact:2,scenario:"tormenta",effect:"Suma barbijos, anteojos de protección y agua tapada.",before:["Tené barbijos y anteojos, y forma de tapar tanques y depósitos de agua."],during:["Quedate adentro con puertas y ventanas cerradas. Protegé nariz, boca y ojos si salís.","No manejes salvo necesidad: la ceniza reduce la visibilidad y daña el motor."],after:["Retirá la ceniza de techos con cuidado: pesa. No la tires a los desagües."],src:["general"]},{id:"sequia",label:"Sequía o escasez de agua",impact:2,scenario:"agua",effect:"Da más peso al pilar Agua: considerá el nivel Recomendado y más días objetivo.",before:["Aumentá tu reserva y arreglá pérdidas.","Tené con qué potabilizar agua."],during:["Priorizá el agua para beber y cocinar. Reutilizá agua para el inodoro.","Seguí las restricciones de tu proveedor."],after:["Reponé la reserva."],src:["general"]},{id:"gas_co",label:"Fuga de gas o monóxido de carbono",impact:3,scenario:"gas",effect:"No cambia las cantidades: es un riesgo de minutos. Suma un detector de monóxido.",before:["Hacé revisar los artefactos a gas todos los años por un gasista matriculado.","Mantené las rejillas de ventilación libres. La llama debe ser azul."],during:["Olor a gas: no prendas luces ni fuego, abrí puertas y ventanas, cortá la llave y salí. Llamá desde afuera.","El monóxido no tiene olor. Dolor de cabeza, mareo o náuseas: salí al aire libre y llamá a emergencias."],after:["No vuelvas a usar el artefacto hasta que lo revise un profesional."],src:["cdc_co","general"]},{id:"telecom",label:"Caída de internet y telefonía",impact:2,scenario:"agua",effect:"Es el caso para el que sirve el plan de «cero comunicaciones»: puntos de encuentro y ventana de radio.",before:["Anotá los teléfonos importantes en papel.","Acordá puntos de encuentro y cada cuánto intentar comunicarse."],during:["Probá con SMS: suelen pasar cuando las llamadas no.","Escuchá la radio en la ventana acordada. Cumplí el plan sin esperar confirmación."],after:["Revisá qué parte del plan no se entendió y practicala."],src:["general"]},{id:"disturbios",label:"Disturbios o inestabilidad",impact:2,scenario:"agua",effect:"Puede complicar el abastecimiento unos días. Suma comida y efectivo.",before:["Mantené tu despensa al día para no depender de salir a comprar."],during:["Quedate en casa si es seguro. Evitá las zonas de conflicto.","Informate por canales oficiales."],after:["Reponé de a poco, sin compras de pánico."],src:["general"]},{id:"brote",label:"Brote sanitario",impact:2,scenario:"agua",effect:"Suma artículos de higiene y repelente donde haya mosquitos. Puede requerir quedarse en casa varios días.",before:["Tené jabón, alcohol en gel, barbijos y repelente.","Eliminá recipientes con agua estancada."],during:["Seguí las indicaciones del sistema de salud de tu zona.","Ante síntomas, consultá: no te automediques."],after:["Reponé el botiquín."],src:["general"]},{id:"hazmat",label:"Escape de materiales peligrosos",impact:3,scenario:"evacuacion",effect:"La indicación puede ser evacuar o encerrarse: definí las dos opciones en tu plan.",before:["Averiguá si hay industrias, depósitos o rutas de carga cerca."],during:["Seguí la indicación oficial: evacuar o quedarte adentro.","Si te indican quedarte: cerrá puertas y ventanas y apagá ventilación y aire acondicionado."],after:["No vuelvas ni ventiles hasta el aviso oficial."],src:["general"]}],kt=[{v:0,label:"No aplica"},{v:1,label:"Bajo"},{v:2,label:"Medio"},{v:3,label:"Alto"}];var Xt=[{id:"p10",label:"Primeros 10 minutos"},{id:"h1",label:"Primera hora"},{id:"h24",label:"Primeras 24 horas"},{id:"h72",label:"Hasta 72 horas"}],pe=[{id:"apagon",label:"Apagón",goalMin:10,phases:{p10:["Buscá la linterna. Evitá las velas.","Fijate si el corte es solo en tu casa (térmica, disyuntor) o en la cuadra.","Desenchufá los equipos sensibles."],h1:["Dejá cerradas la heladera y el freezer.","Poné los celulares en modo ahorro.","Si tu edificio usa bomba, juntá agua mientras quede en el tanque.","Si alguien depende de un equipo eléctrico, activá su plan de respaldo."],h24:["Prendé la radio en la ventana acordada.","Pasadas 4 horas, no comas lo perecedero de la heladera.","Nunca uses generador, brasero ni parrilla adentro."],h72:["Racioná la batería: un celular prendido a la vez.","Revisá cuánta agua y comida queda y ajustá las raciones."]},drill:["Encontrar las linternas a oscuras","Cortar la térmica general","Poner los celulares en modo ahorro","Sintonizar la radio","Reunirse en el lugar acordado de la casa"]},{id:"agua",label:"Corte de agua o de varios servicios",goalMin:15,phases:{p10:["Si todavía sale agua, llená recipientes limpios, ollas y bidones.","Contá cuánta agua segura tenés."],h1:["Separá el agua para b
