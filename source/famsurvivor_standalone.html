  <style>/* FamSurvivor v2 — sistema visual «protección civil moderna».
   Marca = azul marino · Acción = azul cívico · Resalte = amarillo de seguridad · Verde/ámbar/rojo SOLO para estados.
   Todo en rem: escala con el tamaño de texto del sistema y con el modo «texto grande». Grilla de 8 pt. */

:root {
  --paper: #F7F9FC; --surface: #FFFFFF; --ink: #0B2545; --ink-2: #3B4F6B; --line: #CBD5E3;
  --accent: #1F6FB2; --accent-ink: #FFFFFF; --mark: #FFC72C; --mark-ink: #0B2545;
  --header: #0B2545; --header-ink: #FFFFFF;
  --ok: #1B6E3C; --ok-bg: #E4F3E9; --warn: #8A5300; --warn-bg: #FFF1CF; --bad: #B3261E; --bad-bg: #FCE8E6; --none: #44556C; --none-bg: #E8EDF4;
  --radius: 0.75rem; --shadow: 0 1px 2px rgba(11, 37, 69, 0.08);
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabs-h: 4rem;
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --paper: #0E1626; --surface: #162238; --ink: #EAF0F8; --ink-2: #B7C3D6; --line: #33445F;
  --accent: #7DBBEE; --accent-ink: #06203A; --header: #0A1220; --header-ink: #EAF0F8;
  --ok: #7FDC9E; --ok-bg: #12301F; --warn: #FFC766; --warn-bg: #3A2A08; --bad: #FF9E96; --bad-bg: #3D1512; --none: #B7C3D6; --none-bg: #1F2D47;
  --shadow: none; color-scheme: dark;
}
:root[data-theme="oled"] { --paper: #000000; --surface: #0A0A0A; --line: #2E2E2E; --header: #000000; --none-bg: #161616; }
:root[data-contrast="1"] { --ink-2: var(--ink); --line: var(--ink); }
:root[data-large="1"] { font-size: 125%; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding: 4.5rem 0 5.5rem; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--sans);
  min-height: 100vh; min-height: 100dvh; overflow-wrap: anywhere;
}
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul, ol, dl, dd, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2 { font-family: var(--serif); font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 1.625rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.0625rem; line-height: 1.3; display: flex; align-items: center; gap: 0.5rem; }
h4 { font-size: 1rem; margin-top: 0.75rem; }
a { color: var(--accent); text-underline-offset: 0.15em; }
strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 0.875rem; }
.lead { font-size: 1.0625rem; color: var(--ink-2); }
.warn-text { color: var(--warn); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.i { width: 1.5rem; height: 1.5rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.3em; }
.i.xl { width: 3rem; height: 3rem; stroke-width: 1.25; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 0.25rem; }
.top :focus-visible, .emergency :focus-visible { outline-color: var(--mark); }
.skip { position: absolute; left: 0.5rem; top: -4rem; z-index: 50; background: var(--mark); color: var(--mark-ink); padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: 700; }
.skip:focus { top: 0.5rem; }

/* ---------- armazón ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 0.5rem;
  min-height: 3.5rem; padding: 0.375rem max(1rem, env(safe-area-inset-right)) 0.375rem max(1rem, env(safe-area-inset-left));
  padding-top: max(0.375rem, env(safe-area-inset-top));
  background: var(--header); color: var(--header-ink); border-bottom: 3px solid var(--mark);
}
.brand { display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
.brand-logo { width: 2rem; height: 2rem; color: var(--mark); }
.brand-name { font: 700 1.125rem/1.1 var(--serif); }
.brand-tag { font-size: 0.75rem; line-height: 1.2; opacity: 0.85; }
.em-btn {
  display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2.75rem; padding: 0 0.875rem; border-radius: 999px;
  border: 2px solid var(--mark); background: transparent; color: var(--header-ink); font: 700 0.9375rem/1 var(--sans); cursor: pointer;
}
.em-btn.active { background: var(--mark); color: var(--mark-ink); }

main { max-width: 40rem; margin: 0 auto; padding: 1rem max(1rem, env(safe-area-inset-right)) calc(var(--tabs-h) + env(safe-area-inset-bottom) + 1.5rem) max(1rem, env(safe-area-inset-left)); }
[role="tabpanel"] { display: flex; flex-direction: column; gap: 1.5rem; outline: none; }
section { display: flex; flex-direction: column; gap: 0.75rem; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabs [role="tab"] {
  min-height: var(--tabs-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.125rem;
  border: 0; border-top: 3px solid transparent; background: none; color: var(--ink-2); font: 600 min(0.75rem, 3.6vw)/1.1 var(--sans); cursor: pointer; padding: 0.25rem 0.125rem; min-width: 0; overflow: hidden;
}
.tabs [aria-selected="true"] { color: var(--ink); border-top-color: var(--accent); font-weight: 700; }
:root[data-scheme="dark"] .tabs [aria-selected="true"] { border-top-color: var(--mark); }

/* ---------- superficies ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 0.75rem; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.stack-s { display: flex; flex-direction: column; gap: 0.5rem; }
.row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.row.tight { flex-wrap: nowrap; }
.task .row.tight { flex-wrap: wrap; }
.row.wrap { flex-wrap: wrap; align-items: flex-end; }
.row.end { justify-content: flex-end; }
.row.tight { gap: 0.25rem; flex: none; }
.grow { flex: 1 1 10rem; }
.split { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0.5rem 0.75rem; }
.split > :first-child { min-width: 0; flex: 1 1 8rem; }
.split > .badge:first-child { flex: 0 1 auto; }
.list { padding: 0; }
.list.card { gap: 0; padding: 0; }
.list.card > li { padding: 0.75rem 1rem; border-top: 1px solid var(--line); }
.list.card > li:first-child { border-top: 0; }
.list.card > li.split { align-items: center; }
.list.plain > li { padding: 0.25rem 0; align-items: center; }
.task { display: flex; flex-direction: column; gap: 0.5rem; }
.rowlink { width: 100%; min-height: 2.75rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; text-decoration: none; cursor: pointer; }
.list.card > li:has(> .rowlink) { padding: 0; }
.list.card .rowlink { padding: 0.75rem 1rem; }
.kvs { display: flex; flex-direction: column; gap: 0.375rem; }
.kv { display: flex; flex-wrap: wrap; gap: 0 0.75rem; }
.kv dt { flex: 0 1 34%; min-width: 5.5rem; }
.kv dd { flex: 1 1 8rem; min-width: 0; }
.kv dt { color: var(--ink-2); }
.tag { display: inline-block; margin-left: 0.375rem; padding: 0.0625rem 0.5rem; border: 1px solid var(--line); border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
.note { border-left: 4px solid var(--mark); background: var(--none-bg); padding: 0.625rem 0.75rem; border-radius: 0 0.5rem 0.5rem 0; font-size: 0.9375rem; }
.notice { border-left: 6px solid var(--mark); }
.notice.bad { border-left-color: var(--bad); }
.empty { text-align: center; color: var(--ink-2); padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.disclaimer { display: flex; gap: 0.5rem; font-size: 0.875rem; color: var(--ink-2); }
.disclaimer .i { width: 1.25rem; height: 1.25rem; margin-top: 0.125rem; }

/* ---------- estados (ícono + texto, nunca solo color) ---------- */
.badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem 0.125rem 0.375rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 700; line-height: 1.4; }
.badge .i { width: 1rem; height: 1rem; stroke-width: 2.25; }
.badge.ok { color: var(--ok); background: var(--ok-bg); }
.badge.warn { color: var(--warn); background: var(--warn-bg); }
.badge.bad { color: var(--bad); background: var(--bad-bg); }
.badge.none, .badge.info { color: var(--none); background: var(--none-bg); }

/* ---------- inicio ---------- */
.eyebrow { font: 700 0.8125rem/1.2 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.hero { border-top: 4px solid var(--mark); }
.big-number { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; }
.big-number .num { font: 700 4rem/1 var(--serif); letter-spacing: -0.02em; }
.big-number .unit { font-size: 1.25rem; font-weight: 600; }
.res-list { display: flex; flex-direction: column; gap: 0.875rem; }
.res-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0 0.5rem; }
.res-name { display: inline-flex; align-items: center; gap: 0.375rem; font-weight: 600; }
.res-days { font-weight: 700; white-space: nowrap; }
.bar { height: 0.625rem; border-radius: 999px; background: var(--none-bg); border: 1px solid var(--line); overflow: hidden; margin-top: 0.25rem; }
.bar > span { display: block; height: 100%; width: 0; background: var(--ok); }
.bar.warn > span { background: repeating-linear-gradient(135deg, var(--warn), var(--warn) 6px, transparent 6px, transparent 9px); }
.weak-tag { display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem; font-weight: 700; color: var(--warn); margin-top: 0.25rem; }
.weak-tag .i { width: 1.125rem; height: 1.125rem; }
.next-step { background: var(--warn-bg); color: var(--ink); border-radius: 0.5rem; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
:root[data-scheme="dark"] .next-step { color: var(--ink); }
.pillars { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(8.5rem, 100%), 1fr)); gap: 0.5rem; }
.pillar { width: 100%; min-height: 6.5rem; display: flex; flex-direction: column; align-items: flex-start; gap: 0.375rem; padding: 0.75rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.pillar-icon { color: var(--accent); }
.pillar-name { font-weight: 700; }
.hero-empty { align-items: center; text-align: center; gap: 1rem; padding: 2rem 0 1rem; }
.brand-mark { width: 5rem; height: 5rem; border-radius: 1.25rem; background: var(--header); color: var(--mark); display: grid; place-items: center; }
.brand-mark .i { width: 3.25rem; height: 3.25rem; stroke-width: 1.5; }

/* ---------- botones y controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 2.75rem; padding: 0.5rem 1rem;
  border: 1.5px solid var(--ink); border-radius: 0.625rem; background: var(--surface); color: var(--ink); font: 600 1rem/1.2 var(--sans); cursor: pointer; text-decoration: none; text-align: center;
  min-width: 2.75rem; max-width: 100%; overflow-wrap: normal; word-break: normal; hyphens: auto;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--surface); border-color: var(--bad); color: var(--bad); }
.btn.ghost, .btn.link { border-color: transparent; background: none; color: var(--accent); text-decoration: underline; }
.btn.link { justify-content: flex-start; padding-left: 0; }
.btn.big { min-height: 3.25rem; font-size: 1.0625rem; width: 100%; max-width: 22rem; }
.btn.small { min-height: 2.75rem; padding: 0.375rem 0.75rem; font-size: 0.9375rem; flex: 0 0 auto; }
.btn.icon { width: 2.75rem; flex: none; padding: 0; border-color: transparent; background: none; color: var(--ink-2); }
.btn.icon.danger { color: var(--bad); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chipbtn { border-radius: 999px; min-height: 2.75rem; padding: 0.25rem 0.875rem; white-space: nowrap; border-color: var(--line); font-size: 0.9375rem; flex: none; }
.chips-scroll { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.25rem 0.125rem 0.5rem; margin: 0 -0.125rem; scrollbar-width: thin; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 0.375rem; }
.seg.wide { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(6rem, 100%), 1fr)); }
.seg .btn { padding-left: 0.75rem; padding-right: 0.75rem; }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg-opt span { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 0.875rem; border: 1.5px solid var(--ink); border-radius: 0.625rem; font-weight: 600; }
.seg-opt input:checked + span { background: var(--ink); color: var(--paper); }
.seg-opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 0.25rem; }
label, .label, legend { font-weight: 600; }
.req { color: var(--bad); }
input, select, textarea {
  font: 1rem/1.4 var(--sans); color: var(--ink); background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: 0.5rem;
  min-height: 2.75rem; padding: 0.5rem 0.75rem; width: 100%; max-width: 100%;
}
textarea { resize: vertical; }
input[type="checkbox"], input[type="radio"] { width: 1.5rem; height: 1.5rem; min-height: 0; padding: 0; flex: none; accent-color: var(--accent); }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--bad); border-width: 2px; }
.hint { font-size: 0.875rem; color: var(--ink-2); font-weight: 400; }
.error { font-size: 0.9375rem; color: var(--bad); font-weight: 600; }
.field.check { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 0.625rem; min-height: 2.75rem; }
.field.check label { flex: 1; font-weight: 500; }
.field.check .hint { flex-basis: 100%; }
fieldset { border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.5rem 0.75rem; }
legend { padding: 0 0.25rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip label { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 0.875rem; border: 1.5px solid var(--ink-2); border-radius: 999px; font-weight: 500; }
.chip input:checked + label { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 700; }
.chip input:checked + label::before { content: "✓ "; white-space: pre; }
.chip input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips-ro { font-weight: 600; }

/* ---------- acordeones, tablas ---------- */
.acc > summary { cursor: pointer; min-height: 2.75rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-weight: 600; list-style: none; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary::after { content: ""; width: 0.625rem; height: 0.625rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); flex: none; margin: 0 0.375rem 0.25rem; }
.acc[open] > summary::after { transform: rotate(-135deg); margin-bottom: -0.25rem; }
.acc-body { display: flex; flex-direction: column; gap: 0.625rem; padding-top: 0.5rem; }
.acc:not([open]) > .acc-body { display: none; }
.acc-body ul, .acc-body ol, .sources, .em-data ul:not(.list) { padding-left: 1.25rem; display: flex; flex-direction: column; gap: 0.375rem; }
.acc-body ul, .sources, .em-data ul:not(.list) { list-style: disc; }
.acc-body ol { list-style: decimal; }
.threat .acc > summary { align-items: flex-start; }
.threat-name { font-weight: 700; flex: 1; }
.table-wrap { overflow-x: auto; padding: 0; }
.matrix { border-collapse: collapse; width: 100%; font-size: 0.9375rem; }
.matrix th, .matrix td { padding: 0.5rem; border-bottom: 1px solid var(--line); text-align: center; }
.matrix th[scope="row"], .matrix thead th:first-child { text-align: left; }
.matrix tr:last-child > * { border-bottom: 0; }
.countdown, .rule { display: flex; gap: 0.5rem; align-items: flex-start; font-weight: 600; }
.copy-area { min-height: 12rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1rem; }

/* ---------- avisos y hojas ---------- */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 0.75rem); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 0 1rem; pointer-events: none; }
.toast { pointer-events: auto; max-width: 32rem; display: flex; align-items: center; gap: 0.75rem; background: var(--ink); color: var(--paper); padding: 0.75rem 1rem; border-radius: 0.625rem; font-weight: 600; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
.toast.bad { border-left: 6px solid var(--bad); }
.toast .btn { background: var(--paper); color: var(--ink); border-color: var(--paper); flex: none; }

dialog { color: var(--ink); }
dialog::backdrop { background: rgba(5, 15, 30, 0.6); }
.sheet {
  width: min(100%, 34rem); max-width: 100%; max-height: min(92dvh, 92vh); margin: auto auto 0; border: 0; border-radius: 1rem 1rem 0 0; background: var(--surface);
  padding: 1.25rem max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); overflow-y: auto;
}
@media (min-width: 40rem) { .sheet { margin: auto; border-radius: 1rem; } }
.sheet, .sheet form { display: flex; flex-direction: column; gap: 0.875rem; }
.sheet:not([open]) { display: none; }
.sticky-actions { position: sticky; bottom: -1rem; background: var(--surface); padding: 0.75rem 0 0.25rem; margin-top: 0.25rem; border-top: 1px solid var(--line); }

#lock { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; }
.lock-card { width: min(100%, 24rem); display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
.lock-card .field { width: 100%; text-align: left; }
.noscript { padding: 2rem; font-size: 1.125rem; }

/* ---------- Modo Emergencia: contraste ≥ 7:1, texto grande, una mano ---------- */
.emergency {
  --e-bg: #FFFFFF; --e-ink: #0B2545; --e-line: #0B2545; --e-done: #E4F3E9; --e-done-ink: #0F4A27;
  width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border: 0; padding: 0; background: var(--e-bg); color: var(--e-ink); overflow-y: auto; font-size: 1.125rem;
}
:root[data-scheme="dark"] .emergency { --e-bg: #000000; --e-ink: #FFFFFF; --e-line: #FFFFFF; --e-done: #0C2A18; --e-done-ink: #A6F0BE; }
.emergency:not([open]) { display: none; }
.em-wrap { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
.em-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; border-bottom: 4px solid var(--mark); padding-bottom: 0.75rem; position: sticky; top: 0; background: var(--e-bg); z-index: 2; padding-top: 0.5rem; }
.em-head h1 { font-size: 1.75rem; }
.em-clock { display: flex; flex-direction: column; align-items: flex-end; }
.em-clock .num { font: 700 2rem/1 var(--sans); }
.em-goal, .em-note { font-size: 0.9375rem; }
.em-lead, .em-progress { font-weight: 600; }
.emergency h2 { font-size: 1.375rem; margin-bottom: 0.5rem; }
.emergency h3 { font-size: 1.125rem; margin-top: 0.75rem; }
.em-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(9rem, 100%), 1fr)); gap: 0.75rem; }
.em-choice { width: 100%; min-height: 5rem; font-size: 1.125rem; font-weight: 700; background: var(--e-bg); color: var(--e-ink); border: 2px solid var(--e-line); }
.em-steps { display: flex; flex-direction: column; gap: 0.5rem; }
.em-step { width: 100%; min-height: 3.75rem; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; text-align: left; background: var(--e-bg); color: var(--e-ink); border: 2px solid var(--e-line); border-radius: 0.75rem; font: 600 1.125rem/1.35 var(--sans); cursor: pointer; }
.em-step.done { background: var(--e-done); color: var(--e-done-ink); border-color: var(--e-done-ink); }
.em-step.done .em-text { text-decoration: line-through; text-decoration-thickness: 1px; }
.em-num { flex: none; width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-weight: 700; }
.em-text { flex: 1; }
.em-at { font-size: 0.9375rem; }
.em-data { border-top: 4px solid var(--mark); padding-top: 1rem; gap: 0.5rem; }
.em-data .list.card, .em-data .card { background: var(--e-bg); border: 2px solid var(--e-line); color: var(--e-ink); }
.em-data .list.card > li { border-top-color: var(--e-line); }
.em-data .tel { font-size: 1.25rem; min-height: 3.5rem; color: var(--e-ink); }
.em-data .kv dt, .em-data .tag { color: var(--e-ink); }
.em-roles { list-style: none !important; padding: 0 !important; }
.em-foot { display: flex; flex-direction: column; gap: 0.75rem; }
.btn.em-primary { min-height: 3.5rem; font-size: 1.125rem; font-weight: 700; background: var(--e-ink); color: var(--e-bg); border-color: var(--e-ink); }
.btn.em-ghost { min-height: 3rem; background: var(--e-bg); color: var(--e-ink); border: 2px solid var(--e-line); }
.emergency .badge { color: var(--e-ink); background: transparent; border: 2px solid var(--e-line); }

@media (prefers-reduced-motion: no-preference) {
  .btn, .pillar, .em-step { transition: background-color 0.12s ease, color 0.12s ease; }
  .bar > span { transition: width 0.3s ease; }
}
@media (min-width: 48rem) {
  .tabs { grid-template-columns: repeat(5, minmax(0, 8rem)); justify-content: center; }
}

/* ---------- pie: créditos (dentro de <main>, arriba de la barra de pestañas) ---------- */
.app-foot { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 0.875rem; line-height: 1.4; color: var(--ink-2); }
.app-foot strong { color: var(--ink); }
.app-foot a { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--ink); font-weight: 700; text-decoration-color: var(--mark); text-decoration-thickness: 0.125em; text-underline-offset: 0.25em; }

/* ---------- impresión: blanco y negro, sin fondos ---------- */
#print-root { display: none; }
@page { size: A4; margin: 12mm; }

/* ---------- 2. tokens: papel cálido, misma marca ---------- */
:root {
  --paper: #F6F4EF;             /* blanco cálido (en la línea de «Cloud Dancer», Pantone 2026) */
  --surface: #FFFEFB;
  --line: #DDD8CD;
  --ink: #0B2545;               /* azul marino de marca: no cambia */
  --ink-2: #44526A;
  --none-bg: #EEEBE3;
  --radius: 1rem;
  --shadow: 0 1px 2px rgb(11 37 69 / 0.06), 0 6px 16px -8px rgb(11 37 69 / 0.18);
  --press: 0.98;
  --hazard: repeating-linear-gradient(135deg, var(--mark) 0 0.5rem, var(--ink) 0.5rem 1rem);
  --sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --serif: var(--display);      /* los títulos dejan la serif del sistema y usan la condensada del sitio */
}
:root[data-scheme="dark"] {
  --paper: #0C1322; --surface: #141D30; --line: #2C3A54; --ink: #EEF2F7; --ink-2: #B9C4D5; --none-bg: #1C2740;
  --shadow: 0 1px 0 rgb(255 255 255 / 0.04) inset, 0 8px 20px -10px rgb(0 0 0 / 0.6);
  --hazard: repeating-linear-gradient(135deg, var(--mark) 0 0.5rem, #0C1322 0.5rem 1rem);
}
:root[data-theme="oled"] { --paper: #000; --surface: #0B0B0B; --line: #2A2A2A; --none-bg: #151515; --shadow: none; }
:root[data-contrast="1"] { --shadow: none; --line: var(--ink); }

/* ---------- 3. texto ---------- */
body { font-family: var(--sans); font-size: 1.0625rem; line-height: 1.55; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: 0; line-height: 1.05; }
h1 { font-size: 2rem; }
h2 { font-size: 1.625rem; }
h1, h2, h3 { text-wrap: balance; }
p, li { text-wrap: pretty; }
.brand-name { font: 700 1.375rem/1 var(--display); letter-spacing: 0.01em; }
.eyebrow { font-family: var(--sans); letter-spacing: 0.08em; }
.i { stroke-width: 2; }

/* ---------- 4. superficies con profundidad que explica (sin vidrio) ---------- */
.card { border-color: transparent; box-shadow: var(--shadow); border-radius: var(--radius); }
:root[data-contrast="1"] .card, :root[data-theme="oled"] .card { border-color: var(--line); }
.hero { border-top: 0; position: relative; overflow: hidden; padding-top: 1.5rem; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto; height: 0.5rem; background: var(--hazard); }
.big-number .num { font: 700 5.5rem/0.85 var(--display); letter-spacing: -0.01em; }
.big-number .unit { font: 700 1.75rem/1 var(--display); }
.bar { height: 0.75rem; border: 0; background: var(--none-bg); }
.next-step { border-radius: 0.875rem; border-left: 6px solid var(--mark); }

/* pilares: el ícono va en una «placa» como las de señalética */
.pillar { border-color: transparent; box-shadow: var(--shadow); border-radius: var(--radius); }
.pillar-icon { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
  background: color-mix(in oklab, var(--accent) 14%, var(--surface)); }
.pillar-name { font: 700 1.25rem/1.1 var(--display); }

/* ---------- 5. botones táctiles ---------- */
.btn { border-radius: 0.875rem; }
.btn.primary { box-shadow: 0 1px 0 rgb(255 255 255 / 0.25) inset, 0 2px 6px -2px rgb(31 111 178 / 0.5); }
.chipbtn { border-radius: 999px; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .pillar, .rowlink, .em-step { transition: transform 0.12s ease, background-color 0.12s ease, color 0.12s ease; }
  .btn:active, .pillar:active, .em-step:active { transform: scale(var(--press)); }
}

/* ---------- 6. barra de pestañas con indicador activo (patrón Material 3) ---------- */
.tabs { box-shadow: 0 -6px 16px -12px rgb(11 37 69 / 0.35); border-top-color: transparent; }
.tabs [role="tab"] { border-top: 0; gap: 0.25rem; }
.tabs [role="tab"] .i { width: 3.5rem; height: 2rem; padding: 0.25rem 1rem; border-radius: 999px; }
.tabs [aria-selected="true"] .i { background: color-mix(in oklab, var(--accent) 18%, var(--surface)); color: var(--ink); }
:root[data-scheme="dark"] .tabs [aria-selected="true"] .i { background: color-mix(in oklab, var(--mark) 22%, var(--surface)); }

/* ---------- 7. hojas que suben (sin JavaScript) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .sheet[open] { transition: translate 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease; }
  @starting-style { .sheet[open] { translate: 0 2rem; opacity: 0; } }
}
.sheet { border-radius: 1.25rem 1.25rem 0 0; }
@media (min-width: 40rem) { .sheet { border-radius: 1.25rem; } }

/* ---------- 8. Modo Emergencia: la señal de peligro como encabezado ---------- */
.em-head { border-bottom: 0; padding-bottom: 1rem; }
.em-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0.5rem; background: var(--hazard); }
.em-head h1 { font-size: 2.25rem; }
.em-clock .num { font: 700 2.5rem/1 var(--display); }
.em-step { border-radius: 1rem; }
.em-num { width: 2.5rem; height: 2.5rem; font: 700 1.25rem/1 var(--display); }

/* ---------- 9. pie ---------- */
.app-foot { border-top: 0; position: relative; }
.app-foot::before { content: ""; position: absolute; top: 0; left: 50%; width: 3rem; height: 0.25rem; translate: -50% 0; background: var(--hazard); border-radius: 999px; }

/* ---------- 10. botones de opciones (idioma y modo de pantalla) ---------- */
.opt-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.hero-empty .opt-row { justify-content: center; margin-bottom: 1.25rem; }
.opt-row .chipbtn { flex: 0 1 auto; }

/* ---------- 11. ahorro de batería: negro puro, sin sombras ni movimiento ---------- */
:root[data-theme="oled"] *, :root[data-theme="oled"] *::before, :root[data-theme="oled"] *::after { transition: none !important; animation: none !important; }
:root[data-theme="oled"] .tabs, :root[data-theme="oled"] .btn.primary { box-shadow: none; }
:root[data-theme="oled"] .tabs { border-top-color: var(--line); }

icos y los teléfonos anotados en papel.","Acordá en familia los puntos de encuentro y la ventana de comunicación.","Informate por radio y canales oficiales; desconfiá de cadenas y rumores.","Si el agua sigue saliendo, juntá en recipientes limpios antes de que se corte.","Usá el celular lo justo: mensajes cortos antes que llamadas.","Esperá el aviso oficial antes de volver a tomar agua de la canilla.","Reponé lo que usaste y anotá qué te faltó.","Apagón extendido","Sin luz suele fallar la bomba de agua, el ascensor, la heladera y la carga del celular. Suma peso a batería, linterna y agua.","Mantené cargada la batería portátil y probá la linterna y la radio una vez por mes.","Si alguien depende de un equipo eléctrico, hablá con la distribuidora y con su médico sobre un plan de respaldo.","Si tu edificio usa bomba, guardá agua extra.","No abras la heladera ni el freezer sin necesidad: cerrada, la heladera conserva unas 4 horas; el freezer lleno, unas 48 horas (24 si está a medio llenar).","Usá linternas. Si prendés velas, nunca las dejes sin supervisión ni cerca de cortinas.","Nunca uses generador, brasero, parrilla ni garrafa para calefaccionar en interiores: producen monóxido de carbono.","Desenchufá los equipos sensibles para protegerlos cuando vuelva la tensión.","Tirá los alimentos perecederos que pasaron más de 4 horas sin frío. Ante la duda, no los comas.","Recargá baterías y reponé pilas.","Calor extremo","Con nivel medio o alto, el cálculo suma agua: +1 L por persona y día (+0,5 L en menores de 9) y 25 % más para mascotas.","Sumá agua a tu reserva y tené sales de rehidratación oral en el botiquín.","Identificá el ambiente más fresco de la casa.","Tomá agua seguido, sin esperar a tener sed. Ofrecé agua a niñas, niños y personas mayores.","Evitá el sol y el esfuerzo en las horas de más calor.","Ante confusión, desmayo o piel muy caliente y seca, llamá a emergencias.","Reponé el agua usada.","Ola polar o frío extremo","Suma abrigo y mantas. El mayor riesgo en casa es el monóxido de carbono.","Hacé revisar estufas y calefones por un gasista matriculado.","Tené mantas y abrigo a mano. Considerá un detector de monóxido de carbono.","Ventilá siempre el ambiente donde haya una estufa a gas o un brasero. No uses hornallas ni horno para calefaccionar.","Apagá braseros y estufas a leña antes de dormir.","Dolor de cabeza, mareo o náuseas en un ambiente calefaccionado: salí al aire libre y llamá a emergencias.","Revisá cañerías y reponé combustible de forma segura.","Tormenta severa, granizo, viento o tornado","Suele traer cortes de luz y anegamientos. Reforzá linterna, batería y documentos en bolsa estanca.","Asegurá o guardá lo que pueda volarse. Limpiá desagües y canaletas.","Seguí los alertas del servicio meteorológico de tu país.","Quedate adentro, lejos de ventanas. Con tornado o viento muy fuerte, andá al ambiente más interior y bajo.","No toques cables caídos ni te acerques a postes o árboles.","Si estás en la calle, no cruces calles anegadas.","Revisá daños con cuidado. Avisá a la distribuidora si hay cables caídos.","Inundación o crecida","Puede obligarte a evacuar. Prepará mochila, documentos en bolsa estanca y el Punto B fuera de la zona.","Guardá comida, documentos y botiquín en lugares altos.","Ubicá la llave de luz y la de gas para cortarlas rápido.","Acordá a dónde ir y por qué camino.","Cortá la luz y el gas si entra agua. Subí a un lugar alto o evacuá si las autoridades lo indican.","No camines ni manejes por agua en movimiento. No toques cables ni artefactos mojados.","Tomá solo agua segura: embotellada, hervida o tratada.","El agua de inundación está contaminada: lavá y desinfectá lo que tocó, y potabilizá el agua antes de tomarla.","No conectes la electricidad hasta que la instalación esté seca y revisada.","Incendio en la vivienda","Se resuelve en minutos: lo que cuenta es la salida y el Punto A, no las provisiones.","Mantené libres las salidas. Tené un matafuegos ABC a mano y aprendé a usarlo.","No sobrecargues enchufes. Acordá dos salidas y el Punto A.","Salí ya y llamá a los bomberos desde afuera. No vuelvas a entrar.","Si hay humo, avanzá agachado. Tocá las puertas antes de abrir: si están calientes, buscá otra salida.","No uses el ascensor.","Entrá solo cuando los bomberos lo autoricen.","Incendio forestal o de interfase y humo","Puede exigir evacuar con poco aviso. Suma barbijos para el humo y mochila lista.","Mantené despejado de pasto seco y leña el entorno de la casa.","Tené la mochila lista y dos caminos de salida.","Si las autoridades indican evacuar, hacelo de inmediato.","Con humo: quedate adentro con puertas y ventanas cerradas, y cuidá a quienes tienen problemas respiratorios.","Volvé solo con autorización. Cuidado con brasas y árboles debilitados.","Sismo","Puede cortar agua, luz y gas a la vez. Reforzá agua, botiquín y calzado cerca de la cama.","Fijá muebles altos y no cuelgues objetos pesados sobre las camas.","Identificá lugares seguros en cada ambiente y dónde se cortan gas, luz y agua.","Agachate, cubrite bajo una mesa firme y agarrate hasta que pare. Alejate de ventanas.","No uses ascensor ni corras hacia la salida mientras tiembla.","Si sentís olor a gas, cortá la llave, ventilá y salí. Esperá réplicas.","Usá mensajes cortos: las líneas se saturan.","Volcán y caída de ceniza","Suma barbijos, anteojos de protección y agua tapada.","Tené barbijos y anteojos, y forma de tapar tanques y depósitos de agua.","Quedate adentro con puertas y ventanas cerradas. Protegé nariz, boca y ojos si salís.","No manejes salvo necesidad: la ceniza reduce la visibilidad y daña el motor.","Retirá la ceniza de techos con cuidado: pesa. No la tires a los desagües.","Sequía o escasez de agua","Da más peso al pilar Agua: considerá el nivel Recomendado y más días objetivo.","Aumentá tu reserva y arreglá pérdidas.","Tené con qué potabilizar agua.","Priorizá el agua para beber y cocinar. Reutilizá agua para el inodoro.","Seguí las restricciones de tu proveedor.","Reponé la reserva.","Fuga de gas o monóxido de carbono","No cambia las cantidades: es un riesgo de minutos. Suma un detector de monóxido.","Hacé revisar los artefactos a gas todos los años por un gasista matriculado.","Mantené las rejillas de ventilación libres. La llama debe ser azul.","Olor a gas: no prendas luces ni fuego, abrí puertas y ventanas, cortá la llave y salí. Llamá desde afuera.","El monóxido no tiene olor. Dolor de cabeza, mareo o náuseas: salí al aire libre y llamá a emergencias.","No vuelvas a usar el artefacto hasta que lo revise un profesional.","Caída de internet y telefonía","Es el caso para el que sirve el plan de «cero comunicaciones»: puntos de encuentro y ventana de radio.","Anotá los teléfonos importantes en papel.","Acordá puntos de encuentro y cada cuánto intentar comunicarse.","Probá con SMS: suelen pasar cuando las llamadas no.","Escuchá la radio en la ventana acordada. Cumplí el plan sin esperar confirmación.","Revisá qué parte del plan no se entendió y practicala.","Disturbios o inestabilidad","Puede complicar el abastecimiento unos días. Suma comida y efectivo.","Mantené tu despensa al día para no depender de salir a comprar.","Quedate en casa si es seguro. Evitá las zonas de conflicto.","Informate por canales oficiales.","Reponé de a poco, sin compras de pánico.","Brote sanitario","Suma artículos de higiene y repelente donde haya mosquitos. Puede requerir quedarse en casa varios días.","Tené jabón, alcohol en gel, barbijos y repelente.","Eliminá recipientes con agua estancada.","Seguí las indicaciones del sistema de salud de tu zona.","Ante síntomas, consultá: no te automediques.","Reponé el botiquín.","Escape de materiales peligrosos","La indicación puede ser evacuar o encerrarse: definí las dos opciones en tu plan.","Averiguá si hay industrias, depósitos o rutas de carga cerca.","Seguí la indicación oficial: evacuar o quedarte adentro.","Si te indican quedarte: cerrá puertas y ventanas y apagá ventilación y aire acondicionado.","No vuelvas ni ventiles hasta el aviso oficial.","No aplica","Bajo","Medio","Alto","Primeros 10 minutos","Primera hora","Primeras 24 horas","Hasta 72 horas","Apagón","Buscá la linterna. Evitá las velas.","Fijate si el corte es solo en tu casa (térmica, disyuntor) o en la cuadra.","Desenchufá los equipos sensibles.","Dejá cerradas la heladera y el freezer.","Poné los celulares en modo ahorro.","Si tu edificio usa bomba, juntá agua mientras quede en el tanque.","Si alguien depende de un equipo eléctrico, activá su plan de respaldo.","Prendé la radio en la ventana acordada.","Pasadas 4 horas, no comas lo perecedero de la heladera.","Nunca uses generador, brasero ni parrilla adentro.","Racioná la batería: un celular prendido a la vez.","Revisá cuánta agua y comida queda y ajustá las raciones.","Encontrar las linternas a oscuras","Cortar la térmica general","Poner los celulares en modo ahorro","Sintonizar la radio","Reunirse en el lugar acordado de la casa","Corte de agua o de varios servicios","Si todavía sale agua, llená recipientes limpios, ollas y bidones.","Contá cuánta agua segura tenés.","Separá el agua para beber de la de higiene.","Informate por radio o canales oficiales sobre la causa y la duración.","Si también fallan los pagos, usá el efectivo solo para lo esencial.","Usá agua segura para beber, cocinar y lavarte los dientes.","Si dudás del agua, hervila o tratala según el rótulo del producto.","Reutilizá agua para el inodoro.","Averiguá dónde reparten agua segura.","Revisá las raciones y cuidá que nadie tome de menos.","Juntar y contar toda el agua segura de la casa","Llenar dos recipientes limpios","Ubicar las pastillas o la lavandina apta","Repasar quién va a buscar agua y adónde","Inundación","Cortá la luz y el gas si entra agua.","Subí documentos, medicación y celulares a un lugar alto o a la mochila.","Reuní a todas las personas y mascotas.","Si las autoridades indican evacuar, salí hacia el punto acordado por el camino más alto.","No camines ni manejes por agua en movimiento.","No toques cables ni artefactos mojados.","Tomá solo agua embotellada, hervida o tratada.","Avisá a tu contacto fuera de la zona dónde estás.","Antes de volver, esperá el aviso oficial.","Limpiá y desinfectá lo que tocó el agua. No conectes la luz hasta que esté seco y revisado.","Cortar la luz y el gas","Subir documentos y medicación","Armar las mochilas","Reunir personas y mascotas en la puerta","Llegar al Punto A","Incendio en casa","Salgan todos ya. No junten cosas.","Si hay humo, avancen agachados. No usen el ascensor.","Llamá a los bomberos desde afuera.","Reúnanse en el Punto A y cuenten que estén todos.","No vuelvas a entrar.","Avisá a los bomberos si falta alguien y dónde podría estar.","Atendé a quien respiró humo: llamá a emergencias médicas.","Entrá solo con autorización de los bomberos.","Avisá a tu contacto fuera de la zona.","Dar la voz de alarma","Salir por la vía acordada","Contar que estén todos","Ofrecé agua a todos, primero a bebés, niñas, niños y personas mayores.","Bajá persianas y cerrá del lado del sol.","Quédense en el ambiente más fresco. Ropa liviana.","Mojá paños o tomá duchas frescas si hay agua.","Tomá agua seguido, sin esperar la sed.","Evitá el esfuerzo y el sol del mediodía.","Confusión, desmayo o piel muy caliente: llamá a emergencias.","Revisá la reserva de agua: con calor se gasta más.","Preguntá cómo están tus vecinos mayores o que viven solos.","Reunir el agua disponible","Preparar el ambiente más fresco","Repasar las señales de alarma por calor","Mientras tiembla: agachate, cubrite y agarrate. Lejos de ventanas.","Cuando pare: calzate y revisá si hay personas heridas.","Olor a gas: cortá la llave, ventilá y salí.","Salí con calma por la escalera si el edificio está dañado.","Andá al Punto A. Esperá réplicas.","Mandá un mensaje corto a tu contacto fuera de la zona.","No entres a edificios dañados.","Escuchá la radio en la ventana acordada.","Revisá agua y comida. Usá agua segura.","Agacharse, cubrirse y agarrarse","Cortar el gas","Tomar la mochila","Salir por la escalera","Tormenta severa","Entrá y alejate de las ventanas.","Entrá o asegurá lo que pueda volarse, si da el tiempo.","Con viento muy fuerte, quedate en el ambiente más interior.","Tené a mano linterna, radio y batería.","No toques cables caídos ni cruces calles anegadas.","Revisá techos y desagües cuando pase.","Si seguís sin luz, seguí los pasos de Apagón.","Guardar lo que pueda volarse","Cerrar persianas y ventanas","Reunirse en el ambiente interior","Tener linterna y radio a mano","Fuga de gas o monóxido","No prendas luces, fuego ni artefactos.","Abrí puertas y ventanas.","Cortá la llave de gas si podés hacerlo rápido.","Salgan todos al aire libre.","Llamá a emergencias desde afuera.","Dolor de cabeza, mareo o náuseas: pedí atención médica.","No vuelvas a entrar hasta que revisen.","Hacé revisar la instalación por un gasista matriculado antes de usarla.","Abrir puertas y ventanas","Cortar la llave de gas","Salir todos","Evacuación","Tomá las mochilas, documentos, medicación, efectivo y llaves.","Cortá gas y luz si da el tiempo.","Salí por la ruta indicada por las autoridades.","Andá al punto de encuentro acordado.","Registrate en el centro de evacuados si vas a uno.","Racioná agua, comida y batería.","Volvé solo con aviso oficial.","Tomar mochilas y documentos","Cortar gas y luz","Reunir personas y mascotas","Cerrar la casa","Cortar gas y luz; tomar documentos y efectivo","Tablero y llave de gas","Apenas se decide salir","Reunir a niñas, niños y mascotas; llevar botiquín y agua","Puerta principal","Si no estamos juntos: ir al Punto A y esperar","Punto A","Sin contacto durante 1 hora","Buscar linternas y revisar el tablero","Tablero eléctrico","Al cortarse la luz","Poner los celulares en modo ahorro y prender la radio","Cocina","A los 10 minutos","Llenar recipientes limpios","Cocina y baño","Al primer aviso de corte","Contar el agua segura y separar la de beber","Despensa","En la primera hora","Cortar luz y gas","Si entra agua","Subir documentos y medicación; armar mochilas","Lugar alto de la casa","Con alerta de crecida","Dar la alarma y abrir la salida","Salida principal","Al ver fuego o humo","Sacar a niñas, niños y mascotas","Dormitorios","Al oír la alarma","Cortar el gas y revisar que no haya heridos","Llave de gas","Cuando deja de temblar","Tomar la mochila y guiar la salida","Escalera","Cargar mochilas, documentos y efectivo","Entrada","Con la orden de evacuar","Reunir personas y mascotas; cerrar la casa","Ubicá hoy la llave de paso: suele estar junto al medidor o antes de cada artefacto.","Para cerrar, girá la manija hasta que quede cruzada (perpendicular) al caño.","Con garrafa: cerrá la válvula del regulador.","No vuelvas a abrir hasta que un gasista matriculado revise la instalación.","Cortar la luz","Ubicá hoy el tablero y marcá la llave general.","Bajá la térmica general o el disyuntor con la mano seca.","Si hay agua en el piso, no toques el tablero: avisá a la distribuidora.","Antes de volver a conectar, desenchufá los equipos sensibles.","Cortar el agua","Ubicá hoy la llave de paso general: suele estar cerca del medidor o en la entrada.","Cerrala girando en sentido horario.","Si tenés tanque, cerrá también su bajada para conservar esa agua.","Potabilizar agua","Si está turbia, filtrala primero con una tela limpia.","Hervila 3 minutos y dejala enfriar tapada.","O agregá 2 gotas por litro de lavandina concentrada apta para desinfectar agua, y esperá 30 minutos.","La cantidad depende de la concentración: seguí siempre el rótulo del producto.","Guardala en recipientes limpios y tapados.","Nunca mezcles lavandina con otros productos de limpieza.","Comida sin heladera","Mantené cerradas las puertas.","Heladera: conserva el frío unas 4 horas.","Freezer lleno: unas 48 horas. A medio llenar: unas 24 horas.","Pasadas 4 horas sin frío, tirá carnes, pescado, huevos, leche y sobras.","No pruebes la comida para saber si está bien. Ante la duda, no la comas.","Monóxido de carbono","No tiene olor ni color.","Nunca uses generador, brasero, parrilla ni anafe a garrafa en interiores, garajes o galerías cerradas.","El generador va afuera, a más de 6 metros de puertas, ventanas y rejillas.","No calefacciones con hornallas ni con el horno.","Dolor de cabeza, mareo, náuseas o sueño: salí al aire libre y llamá a emergencias.","Usar el matafuegos","Solo para fuegos chicos y con la salida a tu espalda. Si crece, salí.","Sacá el precinto y el seguro.","Apuntá a la base del fuego, no a las llamas.","Apretá la manija y barré de lado a lado.","Revisá cada mes que la aguja esté en verde.","Sin red ni mapas","Anotá en papel las direcciones de los puntos de encuentro y cómo llegar.","Elegí referencias que no cambien: una plaza, una escuela, una estación.","Mandá SMS antes que llamar: ocupan menos red.","Un mensaje útil dice: quién sos, dónde estás, cómo estás y a dónde vas.","Cumplí el plan aunque no logres comunicarte.","Agua para el traslado (al menos 1 litro por persona)","Comida lista para comer para un día","Linterna con pilas","Batería portátil cargada y cable","Botiquín y medicación esencial","Teléfonos anotados en papel y la tarjeta de billetera","Abrigo, muda de ropa y calzado cerrado","Artículos de higiene y barbijos","Llaves de la casa y del vehículo","Pañales y toallitas","Comida o fórmula del bebé y agua segura para prepararla","Abrigo y una manta para el bebé","Alimento y agua para la mascota","Correa o transportadora","Libreta sanitaria de la mascota","Emergencias (policía y ambulancia)","Bomberos","Emergencias médicas (SAME)","Defensa Civil","Emergencias","Emergencia médica (SAME 105)","Ambulancia (SAMU)","Carabineros","Policía","Comisión Europea","Estrategia de la Unión de Preparación: autosuficiencia mínima de 72 horas","Gobierno del Reino Unido (Cabinet Office)","Campaña «Be Ready»: 3 días de provisiones; 3 L de agua para beber por persona y día, más lo necesario para cocinar e higiene","Cifras confirmadas por cobertura de prensa del lanzamiento; no se pudo abrir la lista oficial en GOV.UK durante esta revisión.","Asociación Esfera","Manual Esfera: 2.100 kcal por persona y día; 2,5–3 L de agua para beber y alimentos; 15 L en total; higiene básica 2–6 L","EFSA","Valores de referencia de ingesta de agua por edad (2010)","Usado solo como orientación para menores de 9 años; los valores de la app están redondeados hacia arriba.","CDC (EE. UU.)","Alimentos tras un corte de luz: heladera 4 h; freezer lleno 48 h, a medio llenar 24 h, con las puertas cerradas","Monóxido de carbono: generadores y parrillas siempre afuera, a más de 6 m (20 pies) de puertas, ventanas y rejillas","Ministerio de Salud (Argentina)","Agua segura: 2 gotas de lavandina por litro y 30 minutos de reposo, o hervir 3 minutos","La dosis vale para lavandina concentrada (55–65 g Cl/L) apta para desinfectar agua. Seguí siempre el rótulo.","Gobierno de Argentina","Números de emergencia: 911, 100, 103, 107","URSEC / Ministerio del Interior (Uruguay)","Plan de numeración: 104 Bomberos, 105 Emergencia Salud Pública; servicio de emergencia 9-1-1","SAMU, Bomberos y Carabineros de Chile","131 SAMU, 132 Bomberos, 133 Carabineros","Gobierno de México","9-1-1, número único de emergencias nacional","Comisión de Regulación de Comunicaciones (Colombia)","123, número único nacional de seguridad y emergencias","Gobierno del Perú","Teléfonos de emergencia: 105 Policía, 106 SAMU, 116 Bomberos, 115 Defensa Civil","Unión Europea","112, número único de emergencias en toda la UE","911, número nacional de emergencias","Número de uso universal en EE. UU.; no se abrió la página oficial en esta revisión.","Manual Veterinario MSD","Necesidad diaria de agua en mamíferos: ~44–66 ml por kg; energía en reposo = 70 × kg^0,75","Orientación general de protección civil","Recomendaciones habituales de organismos de protección civil y Cruz Roja","Texto orientativo redactado para la app. Contrastalo con tu Defensa Civil o municipio.","FamSurvivor","Supuesto de planificación de
